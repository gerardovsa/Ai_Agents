name: Database Structure Validation

# Run on pushes to main branches and pull requests
on:
  push:
    branches: [ main, v9, V2_clean ]
  pull_request:
    branches: [ main, v9, V2_clean ]
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  validate-database-structure:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psycopg2-binary python-dotenv
    
    - name: Run database structure analysis
      env:
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      run: |
        echo "Running enhanced database structure analyzer..."
        python data/show_database_structure_enhanced.py
    
    - name: Check for CRITICAL issues
      run: |
        echo "Checking for critical database issues..."
        if grep -q "CRITICAL" data/database_analysis_report_enhanced.txt; then
          echo "❌ CRITICAL database issues found!"
          echo "Please review the report below:"
          grep -A 5 "CRITICAL" data/database_analysis_report_enhanced.txt || true
          exit 1
        else
          echo "✅ No critical issues found"
        fi
    
    - name: Check for HIGH severity issues
      run: |
        echo "Checking for high severity issues..."
        if grep -q "\[HIGH\]" data/database_analysis_report_enhanced.txt; then
          echo "⚠️  HIGH severity issues found:"
          grep -B 2 -A 3 "\[HIGH\]" data/database_analysis_report_enhanced.txt | head -20 || true
          echo ""
          echo "Please review full report in artifacts"
        fi
    
    - name: Check connection manager compliance
      run: |
        echo "Validating connection manager usage..."
        if grep -q "DUPLICATE_CLIENT" data/database_analysis_report_enhanced.txt; then
          echo "❌ Connection manager violations detected!"
          echo "This may cause Supabase connection issues."
          grep -A 3 "DUPLICATE_CLIENT" data/database_analysis_report_enhanced.txt || true
          exit 1
        else
          echo "✅ Connection manager compliance verified"
        fi
    
    - name: Upload analysis report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: database-analysis-report
        path: data/database_analysis_report_enhanced.txt
        retention-days: 30
    
    - name: Summary
      if: success()
      run: |
        echo "✅ Database structure validation passed!"
        echo ""
        echo "Summary:"
        grep -E "Found [0-9]+ total issues" data/database_analysis_report_enhanced.txt || echo "No issues found"
