name: Build and Push Docker Image

on:
  push:
    branches: [v5]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/gerardovsa/ai_agents:latest
            ghcr.io/gerardovsa/ai_agents:v5
            ghcr.io/gerardovsa/ai_agents:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/gerardovsa/ai_agents:buildcache
          cache-to: type=registry,ref=ghcr.io/gerardovsa/ai_agents:buildcache,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
      
      - name: Trigger Render deployment (optional)
        if: success()
        run: |
          echo "Docker image built successfully!"
          echo "Image: ghcr.io/gerardovsa/ai_agents:latest"
          echo "SHA: ghcr.io/gerardovsa/ai_agents:${{ github.sha }}"
          echo ""
          echo "To use this image in Render, update your render.yaml:"
          echo "  image:"
          echo "    url: ghcr.io/gerardovsa/ai_agents:latest"
