# ========================================
# AI Agents Platform - Render.com Configuration
# ========================================
# Region: Singapore (optimized for Australia)
# Deployment Type: Docker
# Repository: gerardovsa/AI_agents
# branch: v7

services:
  # ==================== AI Agents Backend Service ====================
  - type: web
    name: ai-agents-backend
    env: docker
    region: singapore  # 🇸🇬 CLOSEST TO AUSTRALIA (~100-150ms latency)
    plan: starter  # $7/month (can downgrade to free after testing)
    
    # Use pre-built Docker image from GitHub Container Registry
    # Images are built automatically on git push via GitHub Actions
    # This reduces deployment time from 10 minutes to 1-2 minutes
    image:
      url: ghcr.io/gerardovsa/ai_agents:latest
      # Alternatively, pin to specific commit:
      # url: ghcr.io/gerardovsa/ai_agents:v7
    
    # Repository configuration (for reference only, image is pre-built)
    repo: https://github.com/gerardovsa/AI_agents
    branch: v9  # ✅ Updated to v9 branch (OAuth fix)
    
    # Deployment settings
    autoDeploy: true  # Auto-deploy on git push
    
    # Health check endpoint
    healthCheckPath: /health
    
    # ==================== Persistent Disk (10GB) ====================
    # Mounts to /data for SQLite databases
    # Cost: $2.50/month (10GB @ $0.25/GB)
    disk:
      name: ai-agents-data
      mountPath: /data
      sizeGB: 10
    
    # ==================== Environment Variables ====================
    envVars:
      # Flask configuration
      - key: PYTHONUNBUFFERED
        value: "1"
      
      # UTF-8 encoding for emoji support
      - key: PYTHONIOENCODING
        value: "utf-8"
      
      - key: LANG
        value: "en_US.UTF-8"
      
      - key: LC_ALL
        value: "en_US.UTF-8"
      
      - key: RENDER
        value: "true"
      
      - key: ENVIRONMENT
        value: "production"
      
      - key: FLASK_ENV
        value: "production"
      
      - key: DEBUG
        value: "False"
      
      - key: PORT
        value: "10000"  # Render default port
      
      # ==================== AI Provider API Keys ====================
      # Note: Add these manually in Render dashboard after deployment
      # Dashboard: https://dashboard.render.com/web/srv-xxxxx/env
      
      - key: ANTHROPIC_API_KEY
        sync: false  # Will add manually (keeps secrets out of git)
      
      - key: OPENAI_API_KEY
        sync: false
      
      - key: DEEPSEEK_API_KEY_1
        sync: false
      
      # ==================== Microsoft OAuth ====================
      - key: MICROSOFT_CLIENT_ID
        sync: false
      
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      
      - key: MICROSOFT_TENANT_ID
        value: common
      
      # ==================== Google OAuth ====================
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      
      - key: GOOGLE_OAUTH_MODE
        value: web  # Use web mode for production (not desktop)
      
      # Update this after deployment with your Render URL
      - key: GOOGLE_REDIRECT_URI
        value: https://ai-agents-backend-singapore.onrender.com/api/auth/google/callback
      
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://ai-agents-backend-singapore.onrender.com/oauth2callback
      
      - key: GOOGLE_OAUTH_SCOPES
        value: https://www.googleapis.com/auth/spreadsheets,https://www.googleapis.com/auth/documents,https://www.googleapis.com/auth/drive,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.send,https://www.googleapis.com/auth/calendar.readonly
      
      # ==================== Database Configuration ====================
      # Supabase PostgreSQL (Production) or SQLite (Local Dev)
      # Controlled by USE_SUPABASE environment variable
      
      # Supabase Configuration (Production)
      - key: USE_SUPABASE
        value: "true"  # Enable Supabase PostgreSQL
      
      - key: SUPABASE_URL
        sync: false  # Add manually: https://ryoicrdifiqhqpsnjmdo.supabase.co
      
      - key: SUPABASE_SERVICE_KEY
        sync: false  # Add manually from Supabase dashboard
      
      - key: SUPABASE_DB_URL
        sync: false  # Add manually: Connection pooler URL (port 6543)
      
      # SQLite Fallback (if Supabase disabled)
      - key: DATABASE_PATH
        value: /data/ai_infrastructure.db
      
      - key: SESSION_DB_PATH
        value: /data/sessions.db
      
      - key: SYNERGY_DB_PATH
        value: /data/synergy_sessions.db
      
      # ==================== Flask Secret Key ====================
      # Generate new key: python -c "import secrets; print(secrets.token_hex(32))"
      - key: SECRET_KEY
        sync: false  # Add manually in dashboard
      
      # ==================== CORS Configuration ====================
      - key: CORS_ORIGINS
        value: "*"  # Update with your frontend URL after deployment

# ========================================
# Post-Deployment Steps
# ========================================
# 1. Add environment variables in Render dashboard:
#    - ANTHROPIC_API_KEY
#    - OPENAI_API_KEY
#    - DEEPSEEK_API_KEY_1
#    - MICROSOFT_CLIENT_ID
#    - MICROSOFT_CLIENT_SECRET
#    - GOOGLE_OAUTH_CLIENT_ID
#    - GOOGLE_OAUTH_CLIENT_SECRET
#    - SECRET_KEY
#
# 2. Update OAuth redirect URLs:
#    - Google Cloud Console: Add https://ai-agents-backend-xxxx.onrender.com/api/auth/google/callback
#    - Microsoft Azure Portal: Add https://ai-agents-backend-xxxx.onrender.com/api/auth/microsoft/callback
#
# 3. Test deployment:
#    - python Render_backend/test_deployment.py https://ai-agents-backend-xxxx.onrender.com
#
# 4. Monitor service:
#    - python Render_backend/monitor_deployment.py srv-xxxxx
#
# ========================================
# Cost Optimization
# ========================================
# Starter Plan: $7/month
#   - Always-on (no spin down)
#   - Better performance
#   - Dedicated resources
#
# Free Plan: $0/month (downgrade after testing)
#   - Spins down after 15 min inactivity
#   - 1-2 min cold start
#   - 750 hours/month free
#
# Downgrade command:
#   python Render_backend/downgrade_to_free.py srv-xxxxx
