# ==============================================================================
# DEPLOYMENT CHECKLIST
# ==============================================================================
# Before deploying, ensure:
#
# 1. DOCKERFILE EXISTS:
#    - Located at project root or path specified in dockerfilePath
#    - Builds successfully locally: docker build -t myapp .
#    - Runs successfully locally: docker run -p 8080:10000 myapp
#
# 2. PORT CONFIGURATION:
#    - Dockerfile accepts PORT as ARG
#    - Application reads PORT from environment
#    - Container exposes the port
#    - Application binds to 0.0.0.0, not localhost
#
# 3. MULTI-STAGE BUILD (recommended):
#    - Reduces final image size
#    - Separates build dependencies from runtime
#    - Faster deployments and lower costs
#
# 4. SECURITY:
#    - Run as non-root user
#    - Don't include secrets in image layers
#    - Use .dockerignore to exclude files
#    - Keep base images updated
#
# 5. .DOCKERIGNORE FILE:
#    Create .dockerignore to exclude unnecessary files:
#    
#    node_modules
#    npm-debug.log
#    .git
#    .env
#    .env.local
#    *.md
#    .vscode
#    .idea
#    __pycache__
#    *.pyc
#    .pytest_cache
#    dist
#    build
#
# 6. HEALTH CHECK IN APPLICATION:
