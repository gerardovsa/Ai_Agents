# ==============================================================================
# DOCKER APPLICATION - RENDER.COM DEPLOYMENT CONFIGURATION
# ==============================================================================
#
# This configuration file deploys a Dockerized application to Render.com.
# Docker allows you to package your application with all dependencies.
#
# WHAT THIS CONFIGURES:
# - Web service running from Docker container
# - Automatic Docker image build from Dockerfile
# - Support for multi-stage builds
# - Environment variable injection into container
#
# PREREQUISITES:
# 1. Dockerfile in project root (or specify path)
# 2. Application exposes port specified in EXPOSE directive
# 3. Container accepts PORT environment variable
# 4. Health check endpoint (optional but recommended)
#
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # DOCKER WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: my-docker-app
    runtime: docker  # IMPORTANT: Use 'docker' runtime
    env: docker
    region: oregon  # Options: oregon, frankfurt, singapore, ohio, virginia
    
    # Docker Configuration
    # Path to Dockerfile relative to repository root
    # Default: ./Dockerfile
    # For monorepos: ./services/api/Dockerfile
    dockerfilePath: ./Dockerfile
    
    # Docker Context (optional)
    # Build context directory, default is repository root
    # dockerContext: ./
    
    # Docker Command (optional)
    # Override CMD in Dockerfile
    # dockerCommand: npm start
    
    # Plan Configuration
    # Starter: Free tier, sleeps after inactivity
    # Standard: $7/month, always on
    # Pro: $25/month, 2GB RAM, 2 CPUs
    plan: starter
    
    # Auto-Deploy
    # Rebuild and redeploy container on git push
    autoDeploy: true
    
    # Health Check
    # Your container must expose this endpoint
    healthCheckPath: /health
    
    # Environment Variables
    # These are injected into the container at runtime
    envVars:
      # Port Configuration
      # CRITICAL: Container MUST listen on this port
      # Use ARG PORT in Dockerfile and EXPOSE $PORT
      - key: PORT
        value: "10000"
      
      # Application Environment
      - key: APP_ENV
        value: production
      
      # Application Secrets
      - key: APP_SECRET
        generateValue: true  # Render generates random value
      
      # Database Connection (if needed)
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: my-postgres-db
      #     property: connectionString
      
      # Redis Connection (if needed)
      # - key: REDIS_URL
      #   fromDatabase:
      #     name: my-redis-db
      #     property: connectionString
      
      # API Keys (examples)
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false

# ==============================================================================
# DOCKERFILE REQUIREMENTS
# ==============================================================================
# Your Dockerfile must meet these requirements:
#
# 1. ACCEPT PORT ENVIRONMENT VARIABLE:
#    Use ARG and ENV to accept PORT from Render
#    
#    ARG PORT=10000
#    ENV PORT=$PORT
#    EXPOSE $PORT
#
# 2. BIND TO 0.0.0.0:
#    Don't use localhost or 127.0.0.1
#    Must listen on 0.0.0.0 to accept external connections
#
# 3. RUN AS NON-ROOT USER (recommended):
#    Create and switch to non-root user for security
#    
#    RUN addgroup -g 1001 -S appuser && adduser -u 1001 -S appuser -G appuser
#    USER appuser
#
# ==============================================================================
