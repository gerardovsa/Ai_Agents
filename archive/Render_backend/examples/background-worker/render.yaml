# ==============================================================================
# POST-DEPLOYMENT STEPS
# ==============================================================================
# After first deployment:
#
# 1. VERIFY WORKER IS RUNNING:
#    python render_universal_cli.py services list
#    # Check status is "available"
#
# 2. CHECK LOGS FOR STARTUP:
#    python render_universal_cli.py logs tail <service-id>
#    # Look for "ready to process jobs" or similar message
#
# 3. TEST JOB PROCESSING:
#    # Add a test job to queue
#    # Verify worker processes it
#    # Check logs for job completion
#
# 4. MONITOR REDIS CONNECTION:
#    # Verify worker can connect to Redis
#    # Check for connection errors in logs
#
# 5. TEST ERROR HANDLING:
#    # Add a job that will fail
#    # Verify worker handles it gracefully
#    # Check error is logged correctly
#
# 6. MONITOR RESOURCE USAGE:
#    python render_universal_cli.py metrics all <service-id>
#    # Check CPU and memory usage
#    # Adjust concurrency if needed
#
# ==============================================================================
# COMMON ISSUES & SOLUTIONS
# ==============================================================================
#
# ISSUE: Worker keeps restarting
# SOLUTION: Worker process must run continuously
#           Check logs for crash errors
#           Ensure worker doesn't exit after processing one job
#           Add error handling to prevent crashes
#
# ISSUE: Can't connect to Redis
# SOLUTION: Verify REDIS_URL environment variable is set
#           Ensure Redis database is created and in same region
#           Check Redis plan has sufficient connections
#           Test connection locally with same URL
#
# ISSUE: Jobs not being processed
# SOLUTION: Verify worker is reading from correct queue
#           Check Redis queue has jobs: redis-cli LLEN myqueue
#           Ensure worker concurrency > 0
#           Check for blocking errors in logs
#
# ISSUE: Memory issues / OOM errors
# SOLUTION: Reduce worker concurrency
#           Enable max-tasks-per-child to restart workers
#           Upgrade to larger plan (more RAM)
#           Check for memory leaks in job processing code
#
# ISSUE: Jobs timing out
# SOLUTION: Increase WORKER_TASK_TIMEOUT
#           Break large jobs into smaller chunks
#           Add progress tracking for long jobs
#           Use task retry mechanism
#
# ISSUE: Worker not shutting down gracefully
# SOLUTION: Implement SIGTERM handler
#           Allow worker to finish current job before exit
#           Set reasonable shutdown timeout
#
# ==============================================================================
# SCALING & PERFORMANCE
# ==============================================================================
#
# HORIZONTAL SCALING:
# - Add multiple worker instances
# - Each processes jobs from same queue
# - Distribute load automatically
# - Scale based on queue depth
#
# VERTICAL SCALING:
# - Upgrade plan for more CPU/RAM
# - Standard: 512MB RAM, 0.5 CPU
# - Pro: 2GB RAM, 2 CPUs
# - Pro Plus: 4GB RAM, 4 CPUs
#
# CONCURRENCY TUNING:
# - Start with: 2 × CPU cores
# - I/O-bound jobs: Higher concurrency (8-16)
# - CPU-bound jobs: Lower concurrency (1-4)
# - Memory-intensive: Reduce concurrency
# - Test and monitor, adjust as needed
#
# QUEUE OPTIMIZATION:
# - Use priority queues for important jobs
# - Separate queues for different job types
# - Set appropriate prefetch values
# - Use result backends sparingly
# - Clean up completed job results
#
# MONITORING:
# - Use python render_universal_cli.py metrics all <service-id>
# - Monitor queue depth (Redis: LLEN queue)
# - Track job processing time
# - Set up alerts for queue backlog
# - Monitor error rates
#
# RETRY STRATEGIES:
# - Exponential backoff for retries
# - Max retry limit (3-5 attempts)
# - Move failed jobs to dead letter queue
# - Alert on too many failures
#
