# ==============================================================================
# BACKGROUND WORKER - RENDER.COM DEPLOYMENT CONFIGURATION
# ==============================================================================
#
# This configuration file deploys a background worker service to Render.com.
# Workers process background jobs without serving HTTP requests.
#
# WHAT THIS CONFIGURES:
# - Worker service that runs continuously
# - Processes jobs from a queue (Redis, RabbitMQ, database, etc.)
# - No HTTP port or health check required
# - Automatic restart on failure
#
# COMMON USE CASES:
# - Processing job queues (Celery, Bull, Sidekiq)
# - Email sending workers
# - Data processing pipelines
# - Scheduled task processors
# - WebSocket connection handlers
# - Video/image processing
# - Report generation
#
# PREREQUISITES:
# 1. Worker process that runs continuously
# 2. Connection to job queue or message broker
# 3. Graceful shutdown handling (SIGTERM)
# 4. Logging for monitoring
#
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # BACKGROUND WORKER SERVICE
  # ----------------------------------------------------------------------------
  - type: worker  # IMPORTANT: Use 'worker' type, not 'web'
    name: my-background-worker
    runtime: python  # Options: python, node, ruby, go, rust, etc.
    region: oregon  # Options: oregon, frankfurt, singapore, ohio, virginia
    
    # Build Configuration
    # Install dependencies required for worker
    buildCommand: pip install -r requirements.txt
    
    # Start Command
    # Command that runs the worker process continuously
    # IMPORTANT: Process must run continuously, not exit
    # 
    # Examples:
    # - Celery: celery -A myapp worker --loglevel=info
    # - Python: python worker.py
    # - Node: node worker.js
    # - Bull: npm start
    startCommand: celery -A myapp worker --loglevel=info --concurrency=4
    
    # Plan Configuration
    # Starter: Free tier, 512MB RAM, 0.5 CPU (limited hours)
    # Standard: $7/month, 512MB RAM, 0.5 CPU (always on)
    # Pro: $25/month, 2GB RAM, 2 CPUs
    plan: standard  # Workers should use Standard or higher (always on)
    
    # Auto-Deploy
    # Automatically redeploy worker on git push
    autoDeploy: true
    
    # Environment Variables
    envVars:
      # Python Version (if using Python)
      - key: PYTHON_VERSION
        value: "3.11"
      
      # Worker Environment
      - key: WORKER_ENV
        value: production
      
      # Redis Connection (for Celery, Bull, etc.)
      # REQUIRED for most job queue systems
      - key: REDIS_URL
        fromDatabase:
          name: my-redis-db
          property: connectionString
      
      # Database Connection (if needed)
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: my-postgres-db
      #     property: connectionString
      
      # Worker Configuration
      # Number of concurrent workers/processes
      - key: WORKER_CONCURRENCY
        value: "4"
      
      # Max tasks per worker before restart
      - key: WORKER_MAX_TASKS_PER_CHILD
        value: "1000"
      
      # Task timeout (seconds)
      - key: WORKER_TASK_TIMEOUT
        value: "300"
      
      # Logging Level
      - key: LOG_LEVEL
        value: info  # Options: debug, info, warning, error
      
      # API Keys (for external services)
      # - key: SENDGRID_API_KEY
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: STRIPE_SECRET_KEY
      #   sync: false

# ==============================================================================
# DATABASES
# ==============================================================================
# Most workers require Redis for job queue
databases:
  - name: my-redis-db
    databaseName: redis
    user: redis
    plan: starter  # Free tier: 25MB storage
    region: oregon  # Should match worker region

# Optional PostgreSQL for persistent data
# databases:
#   - name: my-postgres-db
#     databaseName: worker_db
#     user: worker_user
#     plan: starter
#     region: oregon

