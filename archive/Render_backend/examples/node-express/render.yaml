# ==============================================================================
# NODE.JS EXPRESS APPLICATION - RENDER.COM DEPLOYMENT CONFIGURATION
# ==============================================================================
#
# This configuration file deploys a Node.js Express application to Render.com.
# Express is a minimal and flexible Node.js web application framework.
#
# WHAT THIS CONFIGURES:
# - Web service running Node.js with Express
# - Automatic npm install on build
# - Health check endpoint
# - Environment-based configuration
#
# PREREQUISITES:
# 1. package.json with start script defined
# 2. Express app listening on process.env.PORT
# 3. Health check endpoint (e.g., /health)
# 4. Node version specified in package.json engines field
#
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # NODE.JS WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: my-node-app
    runtime: node
    env: node
    region: oregon  # Options: oregon, frankfurt, singapore, ohio, virginia
    
    # Build Configuration
    # Automatically runs 'npm install' or 'yarn install'
    # Add custom build steps if needed (e.g., TypeScript compilation)
    buildCommand: npm install && npm run build
    
    # Start Command
    # Must match "start" script in package.json
    # Common options:
    # - npm start (production)
    # - node server.js (direct)
    # - node dist/index.js (for compiled TypeScript)
    # - pm2 start ecosystem.config.js (for PM2 process manager)
    startCommand: npm start
    
    # Plan Configuration
    # Starter: Free tier, sleeps after inactivity
    # Standard: $7/month, always on
    # Pro: $25/month, 2GB RAM, 2 CPUs
    plan: starter
    
    # Auto-Deploy
    # When true, pushes to branch automatically trigger deployments
    autoDeploy: true
    
    # Health Check
    # Render pings this endpoint to verify service is running
    # Your Express app should respond with HTTP 200
    healthCheckPath: /health
    
    # Environment Variables
    envVars:
      # Node Version
      # Should match version in package.json "engines" field
      - key: NODE_VERSION
        value: "20.11.0"
      
      # Node Environment
      # Enables production optimizations
      - key: NODE_ENV
        value: production
      
      # Port
      # CRITICAL: Your Express app MUST listen on this port
      # Example: app.listen(process.env.PORT || 3000)
      - key: PORT
        value: "10000"  # Render default, but app should read from process.env.PORT
      
      # Application Secret
      # For session management, JWT signing, etc.
      - key: APP_SECRET
        generateValue: true  # Render generates random value
      
      # CORS Origins (if needed)
      # Comma-separated list of allowed origins
      - key: CORS_ORIGINS
        value: "https://myfrontend.com,https://www.myfrontend.com"
      
      # Database Connection (if using PostgreSQL)
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: my-postgres-db
      #     property: connectionString
      
      # MongoDB Connection (if using MongoDB Atlas)
      # - key: MONGODB_URI
      #   sync: false  # Marked as secret, won't appear in logs
      
      # Redis Connection (if using Redis)
      # - key: REDIS_URL
      #   fromDatabase:
      #     name: my-redis-db
      #     property: connectionString
      
      # API Keys (examples)
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: SENDGRID_API_KEY
      #   sync: false
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      
      # Logging Level
      - key: LOG_LEVEL
        value: info  # Options: error, warn, info, debug
      
      # Max Request Body Size
      - key: MAX_BODY_SIZE
        value: 10mb

# ==============================================================================
# DATABASES (OPTIONAL)
# ==============================================================================
# Uncomment to create a PostgreSQL database automatically
# databases:
#   - name: my-postgres-db
#     databaseName: nodejs_db
#     user: nodejs_user
#     plan: starter  # Free tier: 1GB storage, 97 connection limit
#     region: oregon  # Should match web service region

