<!-- InHouse Kanban Module Sidebar -->
<div id="inhouse-kanban-sidebar" class="module-sidebar kanban-sidebar" style="display: none; width: 480px;">
    <div class="module-sidebar-header">
        <h2>
            <i class="fas fa-industry"></i>
            Production Workflow
        </h2>
        <button class="close-module-btn" onclick="window.moduleLoader.toggleModule('inhouse-kanban')">
            <i class="fas fa-times"></i>
        </button>
    </div>

    <div class="module-sidebar-content">
        <!-- Sub-tab Navigation -->
        <div class="module-sub-tabs">
            <button class="module-sub-tab active" data-tab="workboard-view">
                <i class="fas fa-columns"></i> Workboard
            </button>
            <button class="module-sub-tab" data-tab="analytics-view">
                <i class="fas fa-chart-line"></i> Analytics
            </button>
        </div>

        <!-- Workboard Tab -->
        <div id="workboard-view" class="module-sub-tab-content active">
            <!-- Workboard & Column Selectors -->
            <div class="sidebar-selectors">
                <div class="selector-group">
                    <label>
                        <i class="fas fa-layer-group"></i> Workboard
                    </label>
                    <select id="sidebar-workboard-selector" class="form-control">
                        <option value="main">Main Workflow</option>
                        <option value="wide-format">Wide Format</option>
                        <option value="apg">APG Supplies</option>
                        <option value="publishing">Publishing</option>
                    </select>
                </div>

                <div class="selector-group">
                    <label>
                        <i class="fas fa-list"></i> Column
                    </label>
                    <select id="sidebar-column-selector" class="form-control">
                        <option value="">Loading columns...</option>
                    </select>
                </div>
            </div>

            <!-- Search and Filters -->
            <div class="sidebar-filters">
                <div class="filter-group-full">
                    <label>
                        <i class="fas fa-search"></i> Search
                    </label>
                    <input type="text" id="sidebar-search" class="form-control"
                        placeholder="Job number, client, item...">
                </div>

                <div class="filter-row">
                    <div class="filter-group-half">
                        <label>
                            <i class="fas fa-calendar-alt"></i> Date Range
                        </label>
                        <select id="sidebar-date-filter" class="form-control form-control-sm">
                            <option value="-1">Last Month</option>
                            <option value="-3">Last 3 Months</option>
                            <option value="-6" selected>Last 6 Months</option>
                            <option value="-12">Last 12 Months</option>
                            <option value="0">All Time</option>
                        </select>
                    </div>

                    <div class="filter-group-half">
                        <label>
                            <i class="fas fa-exclamation-circle"></i> Priority
                        </label>
                        <select id="sidebar-priority-filter" class="form-control form-control-sm">
                            <option value="all">All</option>
                            <option value="critical">Critical</option>
                            <option value="high">High</option>
                            <option value="medium">Medium</option>
                            <option value="low">Low</option>
                        </select>
                    </div>
                </div>

                <div class="filter-actions">
                    <button class="btn btn-sm btn-secondary" id="sidebar-clear-filters">
                        <i class="fas fa-times"></i> Clear
                    </button>
                    <button class="btn btn-sm btn-primary" id="sidebar-refresh">
                        <i class="fas fa-sync-alt"></i> Refresh
                    </button>
                </div>
            </div>

            <!-- Job Cards List -->
            <div id="sidebar-cards-container" class="sidebar-cards-list">
                <!-- Cards will be dynamically inserted here -->
                <div class="sidebar-loading" style="display: none;">
                    <div class="spinner-small"></div>
                    <p>Loading jobs...</p>
                </div>
                <div class="sidebar-empty" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <p>No jobs found</p>
                </div>
            </div>
        </div>

        <!-- Analytics Tab -->
        <div id="analytics-view" class="module-sub-tab-content">
            <div class="analytics-container">
                <div class="analytics-header">
                    <h3><i class="fas fa-chart-line"></i> Analytics</h3>
                    <p class="analytics-workboard-name">Current Workboard: <span id="analytics-workboard-display">Main
                            Workflow</span></p>
                </div>

                <!-- Quick Stats -->
                <div class="analytics-quick-stats">
                    <div class="stat-box">
                        <div class="stat-label">Total Jobs</div>
                        <div class="stat-value" id="analytics-total">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">In Progress</div>
                        <div class="stat-value" id="analytics-in-progress">0</div>
                    </div>
                    <div class="stat-box stat-box-warning">
                        <div class="stat-label">Delayed</div>
                        <div class="stat-value" id="analytics-delayed">0</div>
                    </div>
                    <div class="stat-box stat-box-success">
                        <div class="stat-label">Completed</div>
                        <div class="stat-value" id="analytics-completed">0</div>
                    </div>
                </div>

                <!-- Stage Breakdown -->
                <div class="analytics-section">
                    <h4>Stage Breakdown</h4>
                    <div id="analytics-stage-breakdown" class="analytics-chart">
                        <!-- Chart will be inserted here -->
                    </div>
                </div>

                <!-- Priority Distribution -->
                <div class="analytics-section">
                    <h4>Priority Distribution</h4>
                    <div id="analytics-priority-breakdown" class="priority-bars">
                        <div class="priority-bar-item">
                            <span class="priority-bar-label"><i class="fas fa-circle" style="color: #EF4444;"></i>
                                Critical</span>
                            <div class="priority-bar-track">
                                <div class="priority-bar-fill priority-critical" id="priority-bar-critical"
                                    style="width: 0%"></div>
                            </div>
                            <span class="priority-bar-value" id="priority-val-critical">0</span>
                        </div>
                        <div class="priority-bar-item">
                            <span class="priority-bar-label"><i class="fas fa-circle" style="color: #F97316;"></i>
                                High</span>
                            <div class="priority-bar-track">
                                <div class="priority-bar-fill priority-high" id="priority-bar-high" style="width: 0%">
                                </div>
                            </div>
                            <span class="priority-bar-value" id="priority-val-high">0</span>
                        </div>
                        <div class="priority-bar-item">
                            <span class="priority-bar-label"><i class="fas fa-circle" style="color: #3B82F6;"></i>
                                Medium</span>
                            <div class="priority-bar-track">
                                <div class="priority-bar-fill priority-medium" id="priority-bar-medium"
                                    style="width: 0%"></div>
                            </div>
                            <span class="priority-bar-value" id="priority-val-medium">0</span>
                        </div>
                        <div class="priority-bar-item">
                            <span class="priority-bar-label"><i class="fas fa-circle" style="color: #6B7280;"></i>
                                Low</span>
                            <div class="priority-bar-track">
                                <div class="priority-bar-fill priority-low" id="priority-bar-low" style="width: 0%">
                                </div>
                            </div>
                            <span class="priority-bar-value" id="priority-val-low">0</span>
                        </div>
                    </div>
                </div>

                <!-- Time in Stage -->
                <div class="analytics-section">
                    <h4>Average Time in Stage</h4>
                    <div id="analytics-time-in-stage" class="time-in-stage-list">
                        <!-- Will be populated dynamically -->
                    </div>
                </div>

                <button class="btn btn-primary btn-block" id="analytics-refresh-btn">
                    <i class="fas fa-sync-alt"></i> Refresh Analytics
                </button>
            </div>
        </div>
    </div>
</div>
