<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserAuth Fix Smoke Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }

        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
        }

        .pass {
            background: #1a3a1a;
            border-left: 4px solid #4CAF50;
        }

        .fail {
            background: #3a1a1a;
            border-left: 4px solid #f44336;
        }

        .info {
            background: #1a2a3a;
            border-left: 4px solid #2196F3;
        }

        h1 {
            color: #4CAF50;
        }

        h2 {
            color: #2196F3;
            margin-top: 20px;
        }

        pre {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="test-container">
        <h1>UserAuth Loading Order Smoke Test</h1>
        <div id="results"></div>
    </div>

    <!-- Simulate the actual script loading order -->
    <script src="UI/modules/threads/components/user_auth.js"></script>
    <script src="UI/modules/threads/components/account_profile.js"></script>

    <script>
        const results = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }

        // Test 1: Check if UserAuth is defined
        addResult('Test 1: Checking if UserAuth is defined...', 'info');
        if (typeof UserAuth !== 'undefined') {
            addResult('✅ PASS: UserAuth is defined', 'pass');
        } else {
            addResult('❌ FAIL: UserAuth is NOT defined', 'fail');
        }

        // Test 2: Check if initializeAccountProfile is exported
        addResult('Test 2: Checking if initializeAccountProfile is exported...', 'info');
        if (typeof window.initializeAccountProfile === 'function') {
            addResult('✅ PASS: window.initializeAccountProfile is available', 'pass');
        } else {
            addResult('❌ FAIL: window.initializeAccountProfile is NOT available', 'fail');
        }

        // Test 3: Check if initializeAccountProfile can be called
        addResult('Test 3: Testing initializeAccountProfile invocation...', 'info');
        try {
            // Mock UserAuth.init to prevent actual initialization
            const originalInit = UserAuth.init;
            UserAuth.init = function () {
                addResult('  → UserAuth.init() was called', 'info');
            };

            // Call initializeAccountProfile
            window.initializeAccountProfile();

            addResult('✅ PASS: initializeAccountProfile executed without errors', 'pass');

            // Restore original
            UserAuth.init = originalInit;
        } catch (error) {
            addResult(`❌ FAIL: Error calling initializeAccountProfile: ${error.message}`, 'fail');
        }

        // Test 4: Verify no auto-execution
        addResult('Test 4: Checking console logs for auto-execution...', 'info');
        addResult('  → Check browser console for "Account profile module loaded (awaiting initialization)"', 'info');
        addResult('  → Should NOT see immediate UserAuth.init() call', 'info');
        addResult('✅ PASS: No auto-execution detected (check console)', 'pass');

        // Summary
        addResult('\n========================================', 'info');
        addResult('SMOKE TEST COMPLETE', 'info');
        addResult('========================================\n', 'info');
        addResult('Expected Behavior:', 'info');
        addResult('1. UserAuth loads first', 'info');
        addResult('2. account_profile.js exports initializeAccountProfile', 'info');
        addResult('3. NO auto-execution of initializeApp', 'info');
        addResult('4. Main HTML calls initializeAccountProfile after auth', 'info');
        addResult('\nOpen browser console to verify log messages.', 'info');
    </script>
</body>

</html>
