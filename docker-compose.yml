version: '3.8'

services:
  # ============================================================================
  # ONLYOFFICE Document Server - Self-hosted office suite
  # ============================================================================
  onlyoffice-documentserver:
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-documentserver
    restart: unless-stopped
    ports:
      - "8080:80"  # HTTP (use nginx for HTTPS in production)
      - "8443:443" # HTTPS (optional)
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-your_secret_key_change_this}
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      - onlyoffice_fonts:/usr/share/fonts/truetype/custom
      - onlyoffice_forgotten:/var/lib/onlyoffice/documentserver/App_Data/cache/files/forgotten
    stdin_open: true
    tty: true
    networks:
      - ai_suite_network

  # ============================================================================
  # PostgreSQL Database for ONLYOFFICE (optional but recommended)
  # ============================================================================
  onlyoffice-postgresql:
    image: postgres:15-alpine
    container_name: onlyoffice-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai_suite_network

  # ============================================================================
  # Backend API Server (FastAPI)
  # ============================================================================
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-suite-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # ONLYOFFICE
      - ONLYOFFICE_SERVER_URL=http://onlyoffice-documentserver
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      
      # AI Models
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      
      # Google Workspace
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      
      # Database
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      
      # Other platforms
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - WOOCOMMERCE_URL=${WOOCOMMERCE_URL}
      - WOOCOMMERCE_KEY=${WOOCOMMERCE_KEY}
      - WOOCOMMERCE_SECRET=${WOOCOMMERCE_SECRET}
    volumes:
      - ./:/app
      - /app/venv  # Exclude venv from mount
    depends_on:
      - onlyoffice-documentserver
      - onlyoffice-postgresql
    networks:
      - ai_suite_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================================
  # Redis (for caching and job queue)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: ai-suite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ai_suite_network

  # ============================================================================
  # Nginx Reverse Proxy (production-ready)
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: ai-suite-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # SSL certificates
    depends_on:
      - backend-api
      - onlyoffice-documentserver
    networks:
      - ai_suite_network

volumes:
  onlyoffice_data:
    driver: local
  onlyoffice_log:
    driver: local
  onlyoffice_fonts:
    driver: local
  onlyoffice_forgotten:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ai_suite_network:
    driver: bridge
