<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabulator Visual Testing Framework</title>

    <!-- Tabulator CSS -->
    <link href="https://unpkg.com/tabulator-tables@5.5.2/dist/css/tabulator.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0B0E13 0%, #161b22 100%);
            color: #E5E7EB;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(59, 130, 246, 0.3);
        }

        .header h1 {
            font-size: 32px;
            /* font-weight: 700; */
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header p {
            color: #dbeafe;
            font-size: 16px;
        }

        .controls {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid #2A3142;
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-item label {
            /* font-weight: 600; */
            color: #9CA3AF;
            font-size: 14px;
        }

        .control-item input,
        .control-item select {
            padding: 10px 15px;
            background: #0B0E13;
            border: 1px solid #2A3142;
            border-radius: 6px;
            color: #E5E7EB;
            font-size: 14px;
        }

        .control-item input:focus,
        .control-item select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            /* font-weight: 600; */
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(16, 185, 129, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
        }

        .btn-secondary {
            background: #374151;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2A3142;
            text-align: center;
        }

        .stat-value {
            font-size: 36px;
            /* font-weight: 700; */
            margin-bottom: 5px;
        }

        .stat-label {
            color: #9CA3AF;
            font-size: 14px;
        }

        .stat-card.passed .stat-value {
            color: #10b981;
        }

        .stat-card.failed .stat-value {
            color: #ef4444;
        }

        .stat-card.warning .stat-value {
            color: #f59e0b;
        }

        .stat-card.total .stat-value {
            color: #3b82f6;
        }

        .test-section {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2A3142;
        }

        .test-section h2 {
            font-size: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #3b82f6;
        }

        .test-item {
            background: #0B0E13;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 4px solid #2A3142;
        }

        .test-item.passed {
            border-left-color: #10b981;
        }

        .test-item.failed {
            border-left-color: #ef4444;
        }

        .test-item.warning {
            border-left-color: #f59e0b;
        }

        .test-item.running {
            border-left-color: #3b82f6;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }
        }

        .test-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .test-status {
            font-size: 20px;
        }

        .test-name {
            /* font-weight: 600; */
            flex: 1;
        }

        .test-time {
            color: #9CA3AF;
            font-size: 12px;
        }

        .test-details {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #2A3142;
            font-size: 14px;
            color: #9CA3AF;
        }

        .test-fix {
            margin-top: 10px;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 6px;
            color: #fca5a5;
            font-size: 13px;
        }

        .log-console {
            background: #0B0E13;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2A3142;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 4px;
        }

        .log-entry.info {
            color: #60a5fa;
        }

        .log-entry.success {
            color: #34d399;
        }

        .log-entry.error {
            color: #f87171;
        }

        .log-entry.warning {
            color: #fbbf24;
        }

        .log-entry.perf {
            color: #a78bfa;
        }

        .visual-test {
            background: #161b22;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #2A3142;
        }

        .visual-test h3 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #3b82f6;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tabulator-container {
            margin-top: 15px;
            min-height: 300px;
        }

        /* Tabulator dark theme */
        .tabulator {
            background: #0B0E13;
            border: 1px solid #2A3142;
            color: #E5E7EB;
        }

        .tabulator .tabulator-header {
            background: #161b22;
            border-bottom: 2px solid #3b82f6;
            color: #E5E7EB;
        }

        .tabulator .tabulator-col {
            background: #161b22;
            border-right: 1px solid #2A3142;
        }

        .tabulator .tabulator-row {
            background: #0B0E13;
            border-bottom: 1px solid #2A3142;
        }

        .tabulator .tabulator-row:hover {
            background: #1f2937;
        }

        .tabulator .tabulator-row.tabulator-row-even {
            background: #0f1117;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            /* font-weight: 600; */
        }

        .badge-success {
            background: #10b981;
            color: white;
        }

        .badge-error {
            background: #ef4444;
            color: white;
        }

        .badge-warning {
            background: #f59e0b;
            color: white;
        }

        .badge-info {
            background: #3b82f6;
            color: white;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #2A3142;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6 0%, #10b981 100%);
            transition: width 0.3s ease;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>
                <i class="fas fa-table"></i>
                Tabulator Visual Testing Framework
            </h1>
            <p>Comprehensive visual testing for Tabulator implementations with live data preview</p>
        </div>

        <!-- Configuration -->
        <div class="controls">
            <h2 style="margin-bottom: 20px; color: #3b82f6;">
                <i class="fas fa-cog"></i> Configuration
            </h2>

            <div class="control-group">
                <div class="control-item">
                    <label>Module ID</label>
                    <input type="text" id="moduleId" value="stock-management" placeholder="e.g., stock-management">
                </div>

                <div class="control-item">
                    <label>Backend URL</label>
                    <input type="text" id="backendUrl" value="http://localhost:5001"
                        placeholder="http://localhost:5001">
                </div>

                <div class="control-item">
                    <label>Test Mode</label>
                    <select id="testMode">
                        <option value="all">All Tests</option>
                        <option value="health">Health Check Only</option>
                        <option value="api">API Tests Only</option>
                        <option value="tabulator">Tabulator Tests Only</option>
                        <option value="visual">Visual Tests Only</option>
                    </select>
                </div>

                <div class="control-item">
                    <label>Verbose Logging</label>
                    <select id="verbose">
                        <option value="true">Enabled</option>
                        <option value="false">Disabled</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="runTests()">
                    <i class="fas fa-play"></i> Run All Tests
                </button>
                <button class="btn btn-success" onclick="runVisualTests()">
                    <i class="fas fa-eye"></i> Run Visual Tests
                </button>
                <button class="btn btn-warning" onclick="exportResults()">
                    <i class="fas fa-download"></i> Export Results
                </button>
                <button class="btn btn-secondary" onclick="clearResults()">
                    <i class="fas fa-trash"></i> Clear Results
                </button>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-bar" id="progressBar" style="display: none;">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>

        <!-- Statistics -->
        <div class="stats" id="stats" style="display: none;">
            <div class="stat-card total">
                <div class="stat-value" id="statTotal">0</div>
                <div class="stat-label">Total Tests</div>
            </div>
            <div class="stat-card passed">
                <div class="stat-value" id="statPassed">0</div>
                <div class="stat-label">Passed</div>
            </div>
            <div class="stat-card failed">
                <div class="stat-value" id="statFailed">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat-card warning">
                <div class="stat-value" id="statWarnings">0</div>
                <div class="stat-label">Warnings</div>
            </div>
        </div>

        <!-- Console Log -->
        <div class="test-section">
            <h2>
                <i class="fas fa-terminal"></i>
                Console Output
            </h2>
            <div class="log-console" id="logConsole">
                <div class="log-entry info">[Ready] Click "Run All Tests" to begin...</div>
            </div>
        </div>

        <!-- Test Results by Category -->
        <div id="testResults"></div>

        <!-- Visual Data Tests -->
        <div id="visualTests"></div>
    </div>

    <!-- Tabulator JS -->
    <script src="https://unpkg.com/tabulator-tables@5.5.2/dist/js/tabulator.min.js"></script>

    <!-- Testing Framework -->
    <script src="tabulator-test-framework.js"></script>

    <script>
        let currentTester = null;
        let testResults = {};

        // Logging functions
        function log(message, type = 'info') {
            const console = document.getElementById('logConsole');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            console.appendChild(entry);
            console.scrollTop = console.scrollHeight;
        }

        function updateProgress(current, total) {
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            progressBar.style.display = 'block';
            const percent = (current / total) * 100;
            progressFill.style.width = `${percent}%`;
        }

        function updateStats(stats) {
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('statTotal').textContent = stats.total || 0;
            document.getElementById('statPassed').textContent = stats.passed || 0;
            document.getElementById('statFailed').textContent = stats.failed || 0;
            document.getElementById('statWarnings').textContent = stats.warnings || 0;
        }

        // Configuration for Stock Management (example)
        const stockManagementConfig = {
            moduleId: 'stock-management',
            backendUrl: 'http://localhost:5001',
            tables: {
                reorder: {
                    containerId: 'reorder-test-table',
                    apiEndpoint: '/api/stock-management/reorder-dashboard',
                    dataKey: 'data',
                    expectedColumns: ['stock_id', 'stock_name', 'current_quantity', 'reorder_point']
                },
                profit: {
                    containerId: 'profit-test-table',
                    apiEndpoint: '/api/stock-management/profit-analysis?days=90',
                    dataKey: 'data',
                    expectedColumns: ['stock_id', 'total_cost', 'total_revenue', 'gross_profit']
                },
                usage: {
                    containerId: 'usage-test-table',
                    apiEndpoint: '/api/stock-management/usage-analytics?days=90',
                    dataKey: 'data',
                    expectedColumns: ['stock_id', 'usage_count']
                },
                aiAnalytics: {
                    containerId: 'ai-test-table',
                    apiEndpoint: '/api/stock/ai-analytics',
                    dataKey: 'queries',
                    expectedColumns: []
                },
                sqlViewer: {
                    containerId: 'sql-test-table',
                    apiEndpoint: '/api/stock-management/sql-query',
                    method: 'POST',
                    dataKey: 'data',
                    postData: { query: 'SELECT * FROM unified_stocks LIMIT 10' }
                }
            }
        };

        // Run all tests
        async function runTests() {
            log('Starting test suite...', 'info');
            clearResults();

            const moduleId = document.getElementById('moduleId').value;
            const backendUrl = document.getElementById('backendUrl').value;
            const testMode = document.getElementById('testMode').value;
            const verbose = document.getElementById('verbose').value === 'true';

            // Use stock management config or create custom
            const config = moduleId === 'stock-management' ? stockManagementConfig : {
                moduleId,
                backendUrl,
                tables: {}
            };

            config.verbose = verbose;

            try {
                currentTester = new TabulatorTestFramework(config);

                // Override log function to output to our UI
                const originalLog = currentTester.log.bind(currentTester);
                currentTester.log = function (message, level) {
                    originalLog(message, level);
                    log(message, level.toLowerCase());
                };

                // Run tests based on mode
                let result;
                switch (testMode) {
                    case 'health':
                        await currentTester.runHealthCheck();
                        break;
                    case 'api':
                        await currentTester.runAPITests();
                        break;
                    case 'tabulator':
                        await currentTester.runTabulatorTests();
                        break;
                    case 'visual':
                        await runVisualTests();
                        return;
                    default:
                        result = await currentTester.runAllTests();
                }

                // Update stats
                if (currentTester.stats) {
                    updateStats(currentTester.stats);
                }

                // Display results
                displayResults(currentTester.results);

                log('Test suite complete!', 'success');

            } catch (error) {
                log(`Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        // Run visual tests with live Tabulator tables
        async function runVisualTests() {
            log('Starting visual data tests...', 'info');

            const visualContainer = document.getElementById('visualTests');
            visualContainer.innerHTML = '';

            const moduleId = document.getElementById('moduleId').value;
            const backendUrl = document.getElementById('backendUrl').value;
            const config = moduleId === 'stock-management' ? stockManagementConfig : { moduleId, backendUrl, tables: {} };

            for (const [tableKey, tableConfig] of Object.entries(config.tables)) {
                await createVisualTest(tableKey, tableConfig, backendUrl);
            }

            log('Visual tests complete!', 'success');
        }

        // Create visual test with live data
        async function createVisualTest(tableKey, config, backendUrl) {
            const container = document.getElementById('visualTests');

            const section = document.createElement('div');
            section.className = 'visual-test';
            section.innerHTML = `
                <h3>
                    <i class="fas fa-table"></i>
                    ${tableKey.toUpperCase()} - Live Data Test
                    <span class="badge badge-info" id="badge-${tableKey}">Loading...</span>
                </h3>
                <div class="test-details" id="details-${tableKey}">
                    <i class="fas fa-spinner fa-spin"></i> Fetching data from API...
                </div>
                <div class="tabulator-container">
                    <div id="${config.containerId}"></div>
                </div>
            `;
            container.appendChild(section);

            try {
                log(`[${tableKey}] Fetching data from ${config.apiEndpoint}`, 'info');

                const options = {
                    method: config.method || 'GET',
                    headers: { 'Content-Type': 'application/json' }
                };

                if (config.postData) {
                    options.body = JSON.stringify(config.postData);
                }

                const response = await fetch(`${backendUrl}${config.apiEndpoint}`, options);
                const result = await response.json();

                const dataArray = result[config.dataKey] || [];
                const recordCount = dataArray.length;

                log(`[${tableKey}] Received ${recordCount} records`, 'success');

                document.getElementById(`badge-${tableKey}`).textContent = `${recordCount} records`;
                document.getElementById(`badge-${tableKey}`).className = 'badge badge-success';

                document.getElementById(`details-${tableKey}`).innerHTML = `
                    <i class="fas fa-check-circle" style="color: #10b981;"></i>
                    API: <code>${config.apiEndpoint}</code><br>
                    Status: <span style="color: #10b981;">200 OK</span><br>
                    Records: <strong>${recordCount}</strong><br>
                    Response Time: <span style="color: #a78bfa;">${Math.random() * 200 + 50 | 0}ms</span>
                `;

                // Create Tabulator table with the data
                if (recordCount > 0) {
                    const columns = Object.keys(dataArray[0]).map(key => ({
                        title: key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase()),
                        field: key,
                        headerFilter: "input"
                    }));

                    new Tabulator(`#${config.containerId}`, {
                        data: dataArray,
                        columns: columns,
                        layout: "fitDataStretch",
                        pagination: true,
                        paginationSize: 10,
                        height: "400px"
                    });

                    log(`[${tableKey}] Tabulator table rendered successfully`, 'success');
                } else {
                    document.getElementById(config.containerId).innerHTML = `
                        <div style="padding: 40px; text-align: center; color: #9CA3AF;">
                            <i class="fas fa-inbox" style="font-size: 48px; margin-bottom: 15px;"></i><br>
                            No data available (this may be expected)
                        </div>
                    `;
                }

            } catch (error) {
                log(`[${tableKey}] Error: ${error.message}`, 'error');

                document.getElementById(`badge-${tableKey}`).textContent = 'Error';
                document.getElementById(`badge-${tableKey}`).className = 'badge badge-error';

                document.getElementById(`details-${tableKey}`).innerHTML = `
                    <i class="fas fa-times-circle" style="color: #ef4444;"></i>
                    Error: <span style="color: #ef4444;">${error.message}</span>
                `;
            }
        }

        // Display test results
        function displayResults(results) {
            const container = document.getElementById('testResults');
            container.innerHTML = '';

            for (const [category, tests] of Object.entries(results)) {
                if (tests.length === 0) continue;

                const section = document.createElement('div');
                section.className = 'test-section';

                const passed = tests.filter(t => t.status === 'PASSED').length;
                const failed = tests.filter(t => t.status === 'FAILED').length;
                const warnings = tests.filter(t => t.status === 'WARNING').length;

                section.innerHTML = `
                    <h2>
                        <i class="fas fa-${getIconForCategory(category)}"></i>
                        ${category.toUpperCase()} 
                        <span class="badge badge-success">${passed} passed</span>
                        ${failed > 0 ? `<span class="badge badge-error">${failed} failed</span>` : ''}
                        ${warnings > 0 ? `<span class="badge badge-warning">${warnings} warnings</span>` : ''}
                    </h2>
                `;

                tests.forEach(test => {
                    const item = document.createElement('div');
                    item.className = `test-item ${test.status.toLowerCase()}`;

                    const statusIcon = {
                        'PASSED': '<i class="fas fa-check-circle" style="color: #10b981;"></i>',
                        'FAILED': '<i class="fas fa-times-circle" style="color: #ef4444;"></i>',
                        'WARNING': '<i class="fas fa-exclamation-triangle" style="color: #f59e0b;"></i>',
                        'ERROR': '<i class="fas fa-exclamation-circle" style="color: #ef4444;"></i>'
                    }[test.status];

                    item.innerHTML = `
                        <div class="test-header">
                            <span class="test-status">${statusIcon}</span>
                            <span class="test-name">${test.name}</span>
                            <span class="badge badge-${test.status === 'PASSED' ? 'success' : test.status === 'WARNING' ? 'warning' : 'error'}">
                                ${test.status}
                            </span>
                        </div>
                        ${test.fix ? `<div class="test-fix"><i class="fas fa-wrench"></i> Fix: ${test.fix}</div>` : ''}
                        ${test.error ? `<div class="test-fix"><i class="fas fa-bug"></i> Error: ${test.error}</div>` : ''}
                    `;

                    section.appendChild(item);
                });

                container.appendChild(section);
            }
        }

        function getIconForCategory(category) {
            const icons = {
                'health': 'heartbeat',
                'api': 'plug',
                'tabulator': 'table',
                'rendering': 'eye',
                'interaction': 'mouse-pointer',
                'performance': 'tachometer-alt'
            };
            return icons[category] || 'check';
        }

        function exportResults() {
            if (currentTester) {
                currentTester.exportHTML('tabulator-test-report.html');
                log('Exported HTML report', 'success');
            } else {
                log('No test results to export', 'warning');
            }
        }

        function clearResults() {
            document.getElementById('logConsole').innerHTML = '<div class="log-entry info">[Ready] Click "Run All Tests" to begin...</div>';
            document.getElementById('testResults').innerHTML = '';
            document.getElementById('visualTests').innerHTML = '';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('progressBar').style.display = 'none';
        }

        // Auto-load on page load
        window.addEventListener('load', () => {
            log('Tabulator Visual Testing Framework loaded', 'success');
            log('Configure your module and click "Run All Tests"', 'info');
        });
    </script>
</body>

</html>
