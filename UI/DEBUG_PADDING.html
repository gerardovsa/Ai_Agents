<!-- PASTE THIS IN BROWSER CONSOLE TO DEBUG PADDING -->
<script>
    // Visual debug helper - paste in console
    (function () {
        const messagesContainer = document.querySelector('.ai-chat-messages');
        const inputContainer = document.querySelector('.ai-chat-input-container');

        console.log('=== PADDING DEBUG ===');
        console.log('Messages container:', messagesContainer);
        console.log('Input container:', inputContainer);

        if (messagesContainer) {
            const computed = getComputedStyle(messagesContainer);
            console.log('Messages computed styles:');
            console.log('  padding-bottom (inline):', messagesContainer.style.paddingBottom);
            console.log('  padding-bottom (computed):', computed.paddingBottom);
            console.log('  height:', computed.height);
            console.log('  max-height:', computed.maxHeight);
            console.log('  overflow-y:', computed.overflowY);

            // Add visual indicator
            messagesContainer.style.border = '5px solid red';
            messagesContainer.style.boxSizing = 'border-box';

            // Show padding visually
            const indicator = document.createElement('div');
            indicator.style.cssText = `
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: ${messagesContainer.style.paddingBottom};
            background: rgba(255, 0, 0, 0.3);
            pointer-events: none;
            z-index: 9999;
            border-top: 3px solid red;
        `;
            indicator.textContent = 'PADDING ZONE: ' + messagesContainer.style.paddingBottom;
            indicator.style.color = 'white';
            indicator.style.fontSize = '20px';
            indicator.style.fontWeight = 'bold';
            indicator.style.display = 'flex';
            indicator.style.alignItems = 'center';
            indicator.style.justifyContent = 'center';

            const parent = messagesContainer.parentElement;
            if (parent) {
                parent.style.position = 'relative';
                parent.appendChild(indicator);
            }
        }

        if (inputContainer) {
            const computed = getComputedStyle(inputContainer);
            console.log('Input container styles:');
            console.log('  height:', inputContainer.offsetHeight);
            console.log('  position:', computed.position);
            console.log('  bottom:', computed.bottom);
            console.log('  z-index:', computed.zIndex);

            // Add visual indicator
            inputContainer.style.border = '5px solid blue';
            inputContainer.style.boxSizing = 'border-box';
        }

        console.log('=== CLICK IN INPUT TO SEE PADDING UPDATE ===');
    })();
</script>
