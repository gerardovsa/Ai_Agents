<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Modules Test Suite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #4fc3f7;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2.5em;
        }

        .test-section {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #4fc3f7;
        }

        .test-section h2 {
            color: #4fc3f7;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .test-item {
            background: #0f3460;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .test-name {
            flex: 1;
            /* font-weight: 500; */
        }

        .test-status {
            padding: 5px 15px;
            border-radius: 4px;
            /* font-weight: bold; */
            min-width: 100px;
            text-align: center;
        }

        .status-pending {
            background: #555;
            color: #fff;
        }

        .status-running {
            background: #ff9800;
            color: #000;
            animation: pulse 1s infinite;
        }

        .status-pass {
            background: #4caf50;
            color: #fff;
        }

        .status-fail {
            background: #f44336;
            color: #fff;
        }

        .status-warn {
            background: #ffeb3b;
            color: #000;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .test-details {
            margin-top: 10px;
            padding: 10px;
            background: #1a1a2e;
            border-radius: 4px;
            font-size: 0.9em;
            color: #bbb;
            display: none;
        }

        .test-details.show {
            display: block;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        button {
            padding: 12px 24px;
            background: #4fc3f7;
            color: #000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            /* font-weight: bold; */
            font-size: 1em;
            transition: all 0.3s;
        }

        button:hover {
            background: #29b6f6;
            transform: translateY(-2px);
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .summary {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .summary-stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
        }

        .stat {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            /* font-weight: bold; */
            margin-bottom: 5px;
        }

        .stat-label {
            color: #bbb;
            font-size: 0.9em;
        }

        .console-output {
            background: #000;
            color: #0f0;
            padding: 15px;
            border-radius: 5px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }

        .console-line {
            margin-bottom: 5px;
        }

        .error {
            color: #f44336;
        }

        .success {
            color: #4caf50;
        }

        .warning {
            color: #ffeb3b;
        }

        .info {
            color: #4fc3f7;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🧪 Internal Modules Test Suite</h1>

        <div class="summary">
            <h2>Test Summary</h2>
            <div class="summary-stats">
                <div class="stat">
                    <div class="stat-number" id="total-tests">0</div>
                    <div class="stat-label">Total Tests</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="passed-tests" style="color: #4caf50;">0</div>
                    <div class="stat-label">Passed</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="failed-tests" style="color: #f44336;">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat">
                    <div class="stat-number" id="warning-tests" style="color: #ffeb3b;">0</div>
                    <div class="stat-label">Warnings</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="run-all-btn">▶️ Run All Tests</button>
            <button id="run-api-btn">🌐 API Tests Only</button>
            <button id="run-module-btn">📦 Module Tests Only</button>
            <button id="clear-btn">🗑️ Clear Results</button>
        </div>

        <!-- Test Sections -->
        <div id="test-container"></div>

        <!-- Console Output -->
        <div class="console-output" id="console-output">
            <div class="console-line info">Console output will appear here...</div>
        </div>
    </div>

    <script>
        // Test Suite Configuration
        const testSuite = {
            'Thread Cards': [
                { name: 'Load thread-card-templates.js', test: () => testScript('thread-cards/thread-card-templates.js') },
                { name: 'Load thread-card-registry.js', test: () => testScript('thread-cards/thread-card-registry.js') },
                { name: 'Load thread-card-expansion.js', test: () => testScript('thread-cards/thread-card-expansion.js') },
                { name: 'Load thread-lock-toggle.js', test: () => testScript('thread-cards/thread-lock-toggle.js') },
                { name: 'Load thread-card-realtime.js', test: () => testScript('thread-cards/thread-card-realtime.js') },
                { name: 'Load thread-card-actions.js', test: () => testScript('thread-cards/thread-card-actions.js') },
                { name: 'Check ThreadCardRegistry exists', test: () => checkGlobal('ThreadCardRegistry') },
                { name: 'API: GET /api/threads/list', test: () => testAPI('/api/threads/list', 'GET', null, '?user_id=1') }
            ],
            'Automation Workflows': [
                { name: 'Load automation-workflows.js', test: () => testScript('automation-workflows/automation-workflows.js') },
                { name: 'Load automation-canvas-extensions.js', test: () => testScript('automation-workflows/automation-canvas-extensions.js') },
                { name: 'Load automation-thread-integration.js', test: () => testScript('automation-workflows/automation-thread-integration.js') },
                { name: 'Check automationCanvas exists', test: () => checkGlobal('automationCanvas') },
                { name: 'API: GET /api/automation/list', test: () => testAPI('/api/automation/list', 'GET') },
                { name: 'API: GET /api/automation/tools', test: () => testAPI('/api/automation/tools', 'GET') }
            ],
            'Communication Hub': [
                { name: 'Load communication-hub-v4-modern.js', test: () => testModule('communication-hub/communication-hub-v4-modern.js') },
                { name: 'Check CommunicationHub exists', test: () => checkGlobal('CommunicationHub') },
                { name: 'API: GET /api/threads/list', test: () => testAPI('/api/threads/list', 'GET', null, '?user_id=1') },
                { name: 'API: POST /api/threads/create', test: () => testAPI('/api/threads/create', 'POST', { user_id: 1, title: 'Test Thread' }) }
            ],
            'Synergy': [
                { name: 'Load synergy-board-init.js', test: () => testScript('synergy/synergy-board-init.js') },
                { name: 'Load synergy-functions.js', test: () => testScript('synergy/synergy-functions.js') },
                { name: 'Load synergy-sidebar-renderer-v2-FLAT.js', test: () => testScript('synergy/synergy-sidebar-renderer-v2-FLAT.js') },
                { name: 'Load synergy-card-renderer.js', test: () => testScript('synergy/synergy-card-renderer.js') },
                { name: 'Check synergyBoard exists', test: () => checkGlobal('synergyBoard') },
                { name: 'API: GET /api/synergy/sessions', test: () => testAPI('/api/synergy/sessions', 'GET') }
            ],
            'Workflow': [
                { name: 'Load workflow-thread-integration.js', test: () => testScript('workflow/workflow-thread-integration.js') },
                { name: 'Load workflow-link-modal.js', test: () => testScript('workflow/workflow-link-modal.js') },
                { name: 'Check WorkflowLinkModal exists', test: () => checkGlobal('WorkflowLinkModal') },
                { name: 'API: GET /api/automation/workflows', test: () => testAPI('/api/automation/workflows', 'GET') }
            ],
            /* DEBUG MODULE - DEACTIVATED
            'Debug Module': [
                { name: 'Load debug-module.js', test: () => testScript('debug-module/debug-module.js') },
                { name: 'Check DebugModule exists', test: () => checkGlobal('debugModule') },
                { name: 'API: GET /api/debug/sessions', test: () => testAPI('/api/debug/sessions', 'GET') }
            ],
            */
            'Transcription': [
                { name: 'Check transcription CSS loaded', test: () => testCSS('transcription/transcription-streaming-container.css') },
                { name: 'Check transcription sidebar CSS', test: () => testCSS('transcription/transcription-sidebar.css') },
                { name: 'API: POST /api/transcribe', test: () => testAPI('/api/transcribe', 'POST', { user_id: 1 }) }
            ],
            'Universal Search': [
                { name: 'Check universal-search button exists', test: () => testElement('[data-action="universal-search"]') },
                { name: 'API: GET /api/universal-search/query', test: () => testAPI('/api/universal-search/query', 'GET', null, '?q=test') }
            ],
            'Vector Database': [
                { name: 'Check vector database modal', test: () => testVectorDatabase() },
                { name: 'API: GET /api/vector-db/collections', test: () => testAPI('/api/vector-db/collections', 'GET') }
            ],
            'Settings Sidebar': [
                { name: 'Check settings sidebar exists', test: () => testElement('[data-action="settings"]') },
                { name: 'API: GET /api/user/preferences', test: () => testAPI('/api/user/preferences', 'GET') }
            ]
        };

        let testResults = {
            total: 0,
            passed: 0,
            failed: 0,
            warnings: 0
        };

        // Initialize test UI
        function initTestUI() {
            const container = document.getElementById('test-container');

            for (const [section, tests] of Object.entries(testSuite)) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'test-section';
                sectionDiv.innerHTML = `<h2>📋 ${section}</h2>`;

                tests.forEach((test, index) => {
                    const testId = `${section.replace(/\s+/g, '-')}-${index}`;
                    const testDiv = document.createElement('div');
                    testDiv.innerHTML = `
                        <div class="test-item" id="${testId}">
                            <div class="test-name">${test.name}</div>
                            <div class="test-status status-pending">PENDING</div>
                        </div>
                        <div class="test-details" id="${testId}-details"></div>
                    `;
                    sectionDiv.appendChild(testDiv);
                    testResults.total++;
                });

                container.appendChild(sectionDiv);
            }

            updateSummary();
        }

        // Test Implementations
        async function testScript(path) {
            const fullPath = `/modules_internal/${path}`;
            try {
                const response = await fetch(fullPath);
                if (response.ok) {
                    const content = await response.text();
                    return { success: true, details: `✅ Script loaded (${content.length} bytes)` };
                }
                return { success: false, details: `❌ HTTP ${response.status}: ${response.statusText}` };
            } catch (error) {
                return { success: false, details: `❌ ${error.message}` };
            }
        }

        async function testModule(path) {
            const fullPath = `/modules_internal/${path}`;
            try {
                const module = await import(fullPath);
                return { success: true, details: `✅ ES6 module loaded (exports: ${Object.keys(module).join(', ')})` };
            } catch (error) {
                return { success: false, details: `❌ ${error.message}` };
            }
        }

        function checkGlobal(name) {
            if (window[name] !== undefined) {
                const type = typeof window[name];
                return { success: true, details: `✅ Global '${name}' exists (type: ${type})` };
            }
            return { success: false, details: `❌ Global '${name}' not found`, warning: true };
        }

        async function testAPI(endpoint, method = 'GET', body = null, query = '') {
            const url = `http://localhost:5001${endpoint}${query}`;

            // Get auth token from localStorage (if available)
            const authToken = localStorage.getItem('authToken') || 'test-token-for-internal-tests';

            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                }
            };

            if (body) {
                options.body = JSON.stringify(body);
            }

            try {
                const response = await fetch(url, options);
                const data = await response.json().catch(() => null);

                if (response.ok) {
                    return {
                        success: true,
                        details: `✅ ${method} ${endpoint} → ${response.status} (${data ? JSON.stringify(data).substring(0, 100) : 'OK'})`
                    };
                }

                return {
                    success: false,
                    details: `❌ ${method} ${endpoint} → ${response.status}: ${data?.error || response.statusText}`
                };
            } catch (error) {
                return {
                    success: false,
                    details: `❌ ${method} ${endpoint} → ${error.message}`,
                    warning: error.message.includes('Failed to fetch')
                };
            }
        }

        async function testCSS(path) {
            const fullPath = `/modules_internal/${path}`;
            const links = Array.from(document.querySelectorAll('link[rel="stylesheet"]'));
            const found = links.some(link => link.href.includes(path));

            if (found) {
                return { success: true, details: `✅ CSS file linked in HTML` };
            }

            // Try to fetch it
            try {
                const response = await fetch(fullPath);
                if (response.ok) {
                    return { success: true, details: `✅ CSS file exists (${response.headers.get('content-length')} bytes)`, warning: true };
                }
                return { success: false, details: `❌ CSS file not found (404)` };
            } catch (error) {
                return { success: false, details: `❌ ${error.message}` };
            }
        }

        function testElement(selector) {
            const element = document.querySelector(selector);
            if (element) {
                return { success: true, details: `✅ Element '${selector}' found in DOM` };
            }
            return { success: false, details: `❌ Element '${selector}' not found`, warning: true };
        }

        async function testVectorDatabase() {
            // Check if vector database is initialized
            if (window.VectorDatabase || document.querySelector('[data-module="vector-database"]')) {
                return { success: true, details: `✅ Vector database module detected` };
            }
            return { success: false, details: `❌ Vector database module not found`, warning: true };
        }

        // Run Tests
        async function runTest(section, testObj, testId) {
            const testItem = document.getElementById(testId);
            const statusEl = testItem.querySelector('.test-status');
            const detailsEl = document.getElementById(`${testId}-details`);

            // Set running state
            statusEl.textContent = 'RUNNING';
            statusEl.className = 'test-status status-running';
            logConsole(`▶️ Running: ${testObj.name}`, 'info');

            try {
                const result = await testObj.test();

                if (result.success) {
                    statusEl.textContent = result.warning ? 'WARN' : 'PASS';
                    statusEl.className = `test-status ${result.warning ? 'status-warn' : 'status-pass'}`;
                    if (result.warning) {
                        testResults.warnings++;
                    } else {
                        testResults.passed++;
                    }
                    logConsole(result.details, result.warning ? 'warning' : 'success');
                } else {
                    statusEl.textContent = result.warning ? 'WARN' : 'FAIL';
                    statusEl.className = `test-status ${result.warning ? 'status-warn' : 'status-fail'}`;
                    if (result.warning) {
                        testResults.warnings++;
                    } else {
                        testResults.failed++;
                    }
                    logConsole(result.details, 'error');
                }

                detailsEl.textContent = result.details;
                detailsEl.classList.add('show');
            } catch (error) {
                statusEl.textContent = 'FAIL';
                statusEl.className = 'test-status status-fail';
                testResults.failed++;
                const errorMsg = `❌ Test error: ${error.message}`;
                detailsEl.textContent = errorMsg;
                detailsEl.classList.add('show');
                logConsole(errorMsg, 'error');
            }

            updateSummary();
        }

        async function runAllTests() {
            resetResults();
            logConsole('🚀 Starting full test suite...', 'info');

            for (const [section, tests] of Object.entries(testSuite)) {
                logConsole(`\n📋 Testing: ${section}`, 'info');

                for (let i = 0; i < tests.length; i++) {
                    const testId = `${section.replace(/\s+/g, '-')}-${i}`;
                    await runTest(section, tests[i], testId);
                    await sleep(100); // Small delay between tests
                }
            }

            logConsole('\n✅ Test suite complete!', 'success');
            showFinalSummary();
        }

        async function runAPITests() {
            resetResults();
            logConsole('🌐 Starting API tests only...', 'info');

            for (const [section, tests] of Object.entries(testSuite)) {
                const apiTests = tests.filter(t => t.name.includes('API:'));
                if (apiTests.length === 0) continue;

                logConsole(`\n📋 Testing: ${section} APIs`, 'info');

                for (let i = 0; i < tests.length; i++) {
                    if (!tests[i].name.includes('API:')) continue;
                    const testId = `${section.replace(/\s+/g, '-')}-${i}`;
                    await runTest(section, tests[i], testId);
                    await sleep(100);
                }
            }

            logConsole('\n✅ API tests complete!', 'success');
        }

        async function runModuleTests() {
            resetResults();
            logConsole('📦 Starting module tests only...', 'info');

            for (const [section, tests] of Object.entries(testSuite)) {
                const moduleTests = tests.filter(t => !t.name.includes('API:'));
                if (moduleTests.length === 0) continue;

                logConsole(`\n📋 Testing: ${section} Modules`, 'info');

                for (let i = 0; i < tests.length; i++) {
                    if (tests[i].name.includes('API:')) continue;
                    const testId = `${section.replace(/\s+/g, '-')}-${i}`;
                    await runTest(section, tests[i], testId);
                    await sleep(100);
                }
            }

            logConsole('\n✅ Module tests complete!', 'success');
        }

        function resetResults() {
            testResults = { total: testResults.total, passed: 0, failed: 0, warnings: 0 };

            document.querySelectorAll('.test-status').forEach(el => {
                el.textContent = 'PENDING';
                el.className = 'test-status status-pending';
            });

            document.querySelectorAll('.test-details').forEach(el => {
                el.classList.remove('show');
            });

            updateSummary();
        }

        function updateSummary() {
            document.getElementById('total-tests').textContent = testResults.total;
            document.getElementById('passed-tests').textContent = testResults.passed;
            document.getElementById('failed-tests').textContent = testResults.failed;
            document.getElementById('warning-tests').textContent = testResults.warnings;
        }

        function showFinalSummary() {
            const passRate = ((testResults.passed / testResults.total) * 100).toFixed(1);
            logConsole(`\n========================================`, 'info');
            logConsole(`📊 FINAL RESULTS`, 'info');
            logConsole(`========================================`, 'info');
            logConsole(`Total Tests: ${testResults.total}`, 'info');
            logConsole(`✅ Passed: ${testResults.passed}`, 'success');
            logConsole(`⚠️  Warnings: ${testResults.warnings}`, 'warning');
            logConsole(`❌ Failed: ${testResults.failed}`, 'error');
            logConsole(`📈 Pass Rate: ${passRate}%`, 'info');
            logConsole(`========================================\n`, 'info');
        }

        function logConsole(message, type = 'info') {
            const consoleEl = document.getElementById('console-output');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            consoleEl.appendChild(line);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        function clearConsole() {
            document.getElementById('console-output').innerHTML = '<div class="console-line info">Console cleared...</div>';
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Event Listeners
        document.getElementById('run-all-btn').addEventListener('click', runAllTests);
        document.getElementById('run-api-btn').addEventListener('click', runAPITests);
        document.getElementById('run-module-btn').addEventListener('click', runModuleTests);
        document.getElementById('clear-btn').addEventListener('click', () => {
            clearConsole();
            resetResults();
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            initTestUI();
            logConsole('🧪 Internal Modules Test Suite Initialized', 'success');
            logConsole('Click "Run All Tests" to begin comprehensive testing', 'info');
        });
    </script>
</body>

</html>
