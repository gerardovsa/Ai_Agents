<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>48V Battery System - Physical Layout Blueprint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }

        .blueprint-container {
            max-width: 1500px;
            margin: 0 auto;
            background: #0a1628;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #4db8ff;
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        svg {
            width: 100%;
            height: auto;
            border: 2px solid #0074D9;
            border-radius: 8px;
            background: #0a1628;
        }
    </style>
</head>

<body>
    <div class="blueprint-container">
        <h1>📐 48V Battery System - Physical Layout Blueprint</h1>

        <svg viewBox="0 0 1400 1100" xmlns="http://www.w3.org/2000/svg">
            <title>48V Battery System - Physical Layout Blueprint</title>
            <desc>Top-down view showing battery placement, busbar locations, and cable routing with actual dimensions
            </desc>

            <!-- Background with grid -->
            <defs>
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0074D9" stroke-width="0.5" opacity="0.3" />
                </pattern>
                <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                    <polygon points="0 0, 10 5, 0 10" fill="#4db8ff" />
                </marker>
            </defs>
            <rect width="1400" height="1100" fill="#0a1628" />
            <rect width="1400" height="1100" fill="url(#grid)" />

            <!-- Title Block - FIXED: Increased height from 70 to 90 -->
            <rect x="50" y="30" width="1300" height="80" fill="none" stroke="#0074D9" stroke-width="3" />
            <text x="700" y="65" text-anchor="middle" font-size="24" fill="#4db8ff" font-weight="bold">BATTERY ENCLOSURE
                - PHYSICAL LAYOUT</text>
            <text x="700" y="95" text-anchor="middle" font-size="14" fill="#4db8ff">Scale: 1:10 | All dimensions in
                millimeters</text>

            <!-- Enclosure outline - FIXED: Moved down from y="150" to y="180" -->
            <rect x="150" y="160" width="1100" height="750" fill="none" stroke="#0074D9" stroke-width="4"
                stroke-dasharray="10,5" />
            <text x="700" y="930" text-anchor="middle" font-size="12" fill="#4db8ff">Enclosure: 1100mm × 750mm
                (ventilated)</text>

            <!-- BATTERY A (Top Left) - FIXED: Moved down from y="200" to y="230" -->
            <rect x="200" y="210" width="535" height="205" fill="#16213e" stroke="#ffd700" stroke-width="3" rx="5" />
            <text x="467" y="310" text-anchor="middle" font-size="18" fill="#ffd700" font-weight="bold">BATTERY A</text>
            <text x="467" y="335" text-anchor="middle" font-size="12" fill="#ffd700">24V 100Ah | 19kg</text>
            <text x="467" y="355" text-anchor="middle" font-size="11" fill="#4db8ff">535×205×215mm</text>

            <!-- Battery A Terminals -->
            <circle cx="250" cy="390" r="15" fill="#ff4444" stroke="#fff" stroke-width="2" />
            <text x="250" y="397" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">+</text>
            <circle cx="684" cy="390" r="15" fill="#4444ff" stroke="#fff" stroke-width="2" />
            <text x="684" y="397" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">−</text>

            <!-- BATTERY B (Top Right) -->
            <rect x="765" y="230" width="535" height="205" fill="#16213e" stroke="#ffd700" stroke-width="3" rx="5" />
            <text x="1032" y="310" text-anchor="middle" font-size="18" fill="#ffd700" font-weight="bold">BATTERY
                B</text>
            <text x="1032" y="335" text-anchor="middle" font-size="12" fill="#ffd700">24V 100Ah | 19kg</text>
            <text x="1032" y="355" text-anchor="middle" font-size="11" fill="#4db8ff">535×205×215mm</text>

            <!-- Battery B Terminals -->
            <circle cx="815" cy="390" r="15" fill="#ff4444" stroke="#fff" stroke-width="2" />
            <text x="815" y="397" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">+</text>
            <circle cx="1249" cy="390" r="15" fill="#4444ff" stroke="#fff" stroke-width="2" />
            <text x="1249" y="397" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">−</text>

            <!-- Series Link A to B (12" / 305mm) -->
            <line x1="684" y1="390" x2="815" y2="390" stroke="#ffd700" stroke-width="5" marker-end="url(#arrow)" />
            <rect x="710" y="370" width="70" height="35" fill="#0a1628" stroke="#4db8ff" stroke-width="1" />
            <text x="745" y="385" text-anchor="middle" font-size="10" fill="#4db8ff" font-weight="bold">12" CABLE</text>
            <text x="745" y="398" text-anchor="middle" font-size="9" fill="#4db8ff">2 AWG (35mm²)</text>

            <!-- BATTERY C (Bottom Left) -->
            <rect x="200" y="485" width="535" height="205" fill="#16213e" stroke="#ffd700" stroke-width="3" rx="5" />
            <text x="467" y="565" text-anchor="middle" font-size="18" fill="#ffd700" font-weight="bold">BATTERY C</text>
            <text x="467" y="590" text-anchor="middle" font-size="12" fill="#ffd700">24V 100Ah | 19kg</text>
            <text x="467" y="610" text-anchor="middle" font-size="11" fill="#4db8ff">535×205×215mm</text>

            <!-- Battery C Terminals -->
            <circle cx="250" cy="645" r="15" fill="#ff4444" stroke="#fff" stroke-width="2" />
            <text x="250" y="652" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">+</text>
            <circle cx="684" cy="645" r="15" fill="#4444ff" stroke="#fff" stroke-width="2" />
            <text x="684" y="652" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">−</text>

            <!-- BATTERY D (Bottom Right) -->
            <rect x="765" y="485" width="535" height="205" fill="#16213e" stroke="#ffd700" stroke-width="3" rx="5" />
            <text x="1032" y="565" text-anchor="middle" font-size="18" fill="#ffd700" font-weight="bold">BATTERY
                D</text>
            <text x="1032" y="590" text-anchor="middle" font-size="12" fill="#ffd700">24V 100Ah | 19kg</text>
            <text x="1032" y="610" text-anchor="middle" font-size="11" fill="#4db8ff">535×205×215mm</text>

            <!-- Battery D Terminals -->
            <circle cx="815" cy="645" r="15" fill="#ff4444" stroke="#fff" stroke-width="2" />
            <text x="815" y="652" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">+</text>
            <circle cx="1249" cy="645" r="15" fill="#4444ff" stroke="#fff" stroke-width="2" />
            <text x="1249" y="652" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">−</text>

            <!-- Series Link C to D (12" / 305mm) -->
            <line x1="684" y1="645" x2="815" y2="645" stroke="#ffd700" stroke-width="5" marker-end="url(#arrow)" />
            <rect x="710" y="625" width="70" height="35" fill="#0a1628" stroke="#4db8ff" stroke-width="1" />
            <text x="745" y="640" text-anchor="middle" font-size="10" fill="#4db8ff" font-weight="bold">12" CABLE</text>
            <text x="745" y="653" text-anchor="middle" font-size="9" fill="#4db8ff">2 AWG (35mm²)</text>

            <!-- Parallel Cables to Busbars (6" / 152mm each) -->
            <!-- A+ to Busbar -->
            <line x1="250" y1="390" x2="250" y2="740" stroke="#ff4444" stroke-width="5" marker-end="url(#arrow)" />
            <text x="270" y="565" font-size="9" fill="#4db8ff">6" | 2 AWG</text>

            <!-- C+ to Busbar -->
            <line x1="250" y1="645" x2="250" y2="740" stroke="#ff4444" stroke-width="5" marker-end="url(#arrow)" />
            <text x="270" y="695" font-size="9" fill="#4db8ff">6" | 2 AWG</text>

            <!-- B- to Busbar -->
            <line x1="1249" y1="390" x2="1249" y2="800" stroke="#4444ff" stroke-width="5" marker-end="url(#arrow)" />
            <text x="1190" y="595" font-size="9" fill="#4db8ff">6" | 2 AWG</text>

            <!-- D- to Busbar -->
            <line x1="1249" y1="645" x2="1249" y2="800" stroke="#4444ff" stroke-width="5" marker-end="url(#arrow)" />
            <text x="1190" y="723" font-size="9" fill="#4db8ff">6" | 2 AWG</text>

            <!-- POSITIVE BUSBAR -->
            <rect x="200" y="740" width="200" height="40" fill="#cc8800" stroke="#ffd700" stroke-width="3" rx="3" />
            <text x="300" y="765" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">+ BUSBAR
                (200A)</text>
            <circle cx="250" cy="760" r="8" fill="#ff4444" stroke="#fff" stroke-width="2" />
            <text x="250" y="785" text-anchor="middle" font-size="8" fill="#4db8ff">A+ & C+</text>

            <!-- NEGATIVE BUSBAR -->
            <rect x="1100" y="800" width="200" height="40" fill="#003366" stroke="#4db8ff" stroke-width="3" rx="3" />
            <text x="1200" y="825" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">− BUSBAR
                (200A)</text>
            <circle cx="1249" cy="820" r="8" fill="#4444ff" stroke="#fff" stroke-width="2" />
            <text x="1249" y="850" text-anchor="middle" font-size="8" fill="#4db8ff">B− & D−</text>

            <!-- 150A FUSE -->
            <rect x="430" y="740" width="60" height="40" fill="#ff6600" stroke="#fff" stroke-width="2" rx="5" />
            <text x="460" y="762" text-anchor="middle" font-size="12" fill="#fff" font-weight="bold">150A</text>
            <text x="460" y="775" text-anchor="middle" font-size="9" fill="#fff">FUSE</text>

            <!-- 3" cable from busbar to fuse -->
            <line x1="400" y1="760" x2="430" y2="760" stroke="#ff4444" stroke-width="5" />
            <text x="415" y="750" text-anchor="middle" font-size="8" fill="#4db8ff">3"</text>

            <!-- Main DC Cables (24-36" / 610-915mm) -->
            <line x1="490" y1="760" x2="600" y2="760" stroke="#ff4444" stroke-width="7" marker-end="url(#arrow)" />
            <line x1="600" y1="760" x2="600" y2="880" stroke="#ff4444" stroke-width="7" marker-end="url(#arrow)" />
            <rect x="510" y="740" width="80" height="35" fill="#0a1628" stroke="#4db8ff" stroke-width="1" />
            <text x="550" y="755" text-anchor="middle" font-size="9" fill="#4db8ff" font-weight="bold">24-36"
                CABLE</text>
            <text x="550" y="768" text-anchor="middle" font-size="8" fill="#4db8ff">2/0 AWG (50mm²)</text>

            <line x1="1100" y1="820" x2="650" y2="820" stroke="#4444ff" stroke-width="7" marker-start="url(#arrow)" />
            <line x1="650" y1="820" x2="650" y2="880" stroke="#4444ff" stroke-width="7" marker-end="url(#arrow)" />
            <rect x="900" y="800" width="80" height="35" fill="#0a1628" stroke="#4db8ff" stroke-width="1" />
            <text x="940" y="815" text-anchor="middle" font-size="9" fill="#4db8ff" font-weight="bold">24-36"
                CABLE</text>
            <text x="940" y="828" text-anchor="middle" font-size="8" fill="#4db8ff">2/0 AWG (50mm²)</text>

            <!-- INVERTER (Outside enclosure) -->
            <rect x="520" y="880" width="200" height="80" fill="#16213e" stroke="#ffd700" stroke-width="3" rx="5" />
            <text x="620" y="905" text-anchor="middle" font-size="14" fill="#ffd700" font-weight="bold">VICTRON</text>
            <text x="620" y="925" text-anchor="middle" font-size="12" fill="#ffd700">MultiPlus-II</text>
            <text x="620" y="943" text-anchor="middle" font-size="10" fill="#4db8ff">48/3000/35</text>
            <circle cx="600" cy="895" r="10" fill="#ff4444" stroke="#fff" stroke-width="2" />
            <text x="600" y="900" text-anchor="middle" font-size="12" fill="#fff">+</text>
            <circle cx="650" cy="895" r="10" fill="#4444ff" stroke="#fff" stroke-width="2" />
            <text x="650" y="900" text-anchor="middle" font-size="12" fill="#fff">−</text>

            <!-- Dimension Lines -->
            <!-- Horizontal battery spacing -->
            <line x1="200" y1="460" x2="735" y2="460" stroke="#00ff00" stroke-width="1" stroke-dasharray="2,2"
                marker-start="url(#arrow)" marker-end="url(#arrow)" />
            <text x="467" y="475" text-anchor="middle" font-size="11" fill="#00ff00" font-weight="bold">535mm
                (21.06")</text>

            <line x1="735" y1="460" x2="765" y2="460" stroke="#00ff00" stroke-width="1" stroke-dasharray="2,2"
                marker-start="url(#arrow)" marker-end="url(#arrow)" />
            <text x="750" y="475" text-anchor="middle" font-size="10" fill="#00ff00">30mm gap</text>

            <!-- Vertical battery spacing -->
            <line x1="170" y1="230" x2="170" y2="435" stroke="#00ff00" stroke-width="1" stroke-dasharray="2,2"
                marker-start="url(#arrow)" marker-end="url(#arrow)" />
            <text x="160" y="332" text-anchor="middle" font-size="11" fill="#00ff00" font-weight="bold"
                transform="rotate(-90 160 332)">205mm (8.07")</text>

            <line x1="170" y1="435" x2="170" y2="485" stroke="#00ff00" stroke-width="1" stroke-dasharray="2,2"
                marker-start="url(#arrow)" marker-end="url(#arrow)" />
            <text x="160" y="460" text-anchor="middle" font-size="10" fill="#00ff00"
                transform="rotate(-90 160 460)">50mm gap</text>

            <!-- Safety Annotations -->
            <text x="460" y="800" font-size="11" fill="#ff6600" font-weight="bold">⚠ FUSE WITHIN 18cm OF BUSBAR</text>
            <text x="700" y="970" text-anchor="middle" font-size="10" fill="#ff6600">⚠ Keep cables away from sharp edges
                | Secure with cable ties</text>

            <!-- Cable Routing Notes - FIXED: Moved down -->
            <rect x="900" y="180" width="330" height="120" fill="#16213e" stroke="#4db8ff" stroke-width="2" rx="5" />
            <text x="1065" y="205" text-anchor="middle" font-size="13" fill="#4db8ff" font-weight="bold">CABLE ROUTING
                RULES</text>
            <text x="920" y="225" font-size="10" fill="#ffd700">✓ All cables same length to busbars</text>
            <text x="920" y="240" font-size="10" fill="#ffd700">✓ M8 ring terminals (crimped, not soldered)</text>
            <text x="920" y="255" font-size="10" fill="#ffd700">✓ Heat shrink on all exposed terminals</text>
            <text x="920" y="270" font-size="10" fill="#ffd700">✓ Torque M8 bolts to 8-10 Nm</text>
            <text x="920" y="285" font-size="10" fill="#ffd700">✓ Ventilation: top & bottom of enclosure</text>
        </svg>
    </div>
</body>

</html>
