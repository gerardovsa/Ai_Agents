     ============================================================================ -->
<script>
    (function () {
        'use strict';

        // Wait for DOM to be fully loaded
        document.addEventListener('DOMContentLoaded', function () {
            initializeSidebarSubTabs();
        });

        /**
         * Initialize sub-tab switching functionality
         */
        function initializeSidebarSubTabs() {
            const sidebar = document.getElementById('inhouse-kanban-sidebar');
            if (!sidebar) {
                console.warn('InHouse Kanban sidebar not found');
                return;
            }

            const subTabs = sidebar.querySelectorAll('.module-sub-tab');
            const tabContents = sidebar.querySelectorAll('.module-sub-tab-content');

            subTabs.forEach(tab => {
                tab.addEventListener('click', function () {
                    const targetTab = this.getAttribute('data-tab');

                    // Remove active class from all tabs and contents
                    subTabs.forEach(t => t.classList.remove('active'));
                    tabContents.forEach(c => c.classList.remove('active'));

                    // Add active class to clicked tab
                    this.classList.add('active');

                    // Show corresponding content
                    const targetContent = document.getElementById(targetTab);
                    if (targetContent) {
                        targetContent.classList.add('active');
                    }

                    console.log('Switched to tab:', targetTab);
                });
            });

            console.log('✅ Sidebar sub-tabs initialized');
        }

        /**
         * Helper function to update analytics display
         * Called by main module when data changes
         */
        window.updateSidebarAnalytics = function (data) {
            if (!data) return;

            // Update quick stats
            const elements = {
                total: document.getElementById('analytics-total'),
                inProgress: document.getElementById('analytics-in-progress'),
                delayed: document.getElementById('analytics-delayed'),
                completed: document.getElementById('analytics-completed')
            };

            if (elements.total) elements.total.textContent = data.total || 0;
            if (elements.inProgress) elements.inProgress.textContent = data.inProgress || 0;
            if (elements.delayed) elements.delayed.textContent = data.delayed || 0;
            if (elements.completed) elements.completed.textContent = data.completed || 0;

            // Update priority bars
            if (data.priorities) {
                Object.keys(data.priorities).forEach(priority => {
                    const count = data.priorities[priority];
                    const percentage = data.total > 0 ? (count / data.total * 100) : 0;

                    const bar = document.getElementById(`priority-bar-${priority}`);
                    const value = document.getElementById(`priority-val-${priority}`);

                    if (bar) bar.style.width = `${percentage}%`;
                    if (value) value.textContent = count;
                });
            }

            // Update time in stage
            if (data.timeInStage) {
                const container = document.getElementById('analytics-time-in-stage');
                if (container) {
                    container.innerHTML = data.timeInStage.map(stage => `
                        <div class="time-in-stage-item">
                            <span class="time-in-stage-name">${stage.name}</span>
                            <span class="time-in-stage-value">${stage.avgTime}</span>
                        </div>
                    `).join('');
                }
            }

            console.log('✅ Sidebar analytics updated');
        };

        /**
         * Helper function to show loading state
         */
        window.showSidebarLoading = function (show) {
            const loadingEl = document.querySelector('.sidebar-loading');
            const emptyEl = document.querySelector('.sidebar-empty');
            const cardsContainer = document.getElementById('sidebar-cards-container');

            if (show) {
                if (loadingEl) loadingEl.style.display = 'flex';
                if (emptyEl) emptyEl.style.display = 'none';
            } else {
                if (loadingEl) loadingEl.style.display = 'none';
            }
        };

        /**
         * Helper function to show empty state
         */
        window.showSidebarEmpty = function (show) {
            const loadingEl = document.querySelector('.sidebar-loading');
            const emptyEl = document.querySelector('.sidebar-empty');

            if (show) {
                if (loadingEl) loadingEl.style.display = 'none';
                if (emptyEl) emptyEl.style.display = 'flex';
            } else {
                if (emptyEl) emptyEl.style.display = 'none';
            }
        };

        console.log('✅ InHouse Kanban sidebar HTML loaded');
    })();
</script>
