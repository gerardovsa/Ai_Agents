# Professional Verification Module - Docker Compose
# ==================================================
# Rapid deployment with multiple service options

version: '3.8'

services:
  # 1. Test Runner - Runs all tests and exits
  test:
    build: .
    image: professional-verification:latest
    container_name: verification-test
    command: python test_no_docker.py
    environment:
      - PYTHONUNBUFFERED=1

  # 2. API Service - Runs Flask API server
  api:
    build: .
    image: professional-verification:latest
    container_name: verification-api
    ports:
      - "5001:5001"
    environment:
      - FLASK_APP=api_server.py
      - FLASK_ENV=development
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: python api_server.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 3. Development Shell - Interactive development
  dev:
    build: .
    image: professional-verification:latest
    container_name: verification-dev
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: /bin/bash
    stdin_open: true
    tty: true

# Usage Examples:
# ===============
#
# Run all tests:
#   docker-compose run --rm test
#
# Start API server:
#   docker-compose up api
#
# Development shell:
#   docker-compose run --rm dev
#
# Build only (no run):
#   docker-compose build
#
# Run smoke test:
#   docker-compose run --rm test python smoke_test.py
#
# Generate report:
#   docker-compose run --rm test python -c "from verification_engine import *; print('Ready')"
