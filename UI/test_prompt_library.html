<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library Test</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="modules/prompt-library.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;
        }

        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .test-header {
            margin-bottom: 30px;
        }

        .test-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .console-output {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .ai-chat-input-wrapper {
            position: relative;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }

        .ai-chat-input-controls {
            display: flex;
            gap: 10px;
        }

        .ai-chat-center {
            flex: 1;
        }

        .ai-chat-input {
            width: 100%;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            padding: 10px;
            font-size: 14px;
            resize: vertical;
        }

        .ai-chat-right-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>

<body>
    <div class="test-container">
        <div class="test-header">
            <h1><i class="fas fa-bolt"></i> Prompt Library Test Page</h1>
            <p>Testing the modular prompt library system</p>
        </div>

        <div class="test-section">
            <h2>Console Output</h2>
            <div class="console-output" id="console-output">Waiting for logs...</div>
        </div>

        <div class="test-section">
            <h2>Button Test</h2>
            <p>Click the lightning bolt button below. The dropdown should appear.</p>

            <div class="ai-chat-input-wrapper">
                <div class="ai-chat-input-controls">
                    <div class="ai-chat-center">
                        <textarea class="ai-chat-input" id="ai-chat-input" rows="3"
                            placeholder="Type your message..."></textarea>
                    </div>
                    <div class="ai-chat-right-buttons">
                        <button class="ai-chat-prompt-library-btn" id="ai-chat-prompt-library-btn"
                            title="Browse Prompt Library">
                            <i class="fas fa-bolt"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="test-section">
            <h2>Test Results</h2>
            <ul id="test-results">
                <li>Waiting for JavaScript to load...</li>
            </ul>
        </div>
    </div>

    <script>
        // Capture console.log for display
        const consoleOutput = document.getElementById('console-output');
        const testResults = document.getElementById('test-results');
        const originalLog = console.log;
        const originalError = console.error;

        function addToConsole(type, ...args) {
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            const timestamp = new Date().toLocaleTimeString();
            const line = `[${timestamp}] ${type}: ${msg}\n`;
            consoleOutput.textContent += line;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        console.log = function (...args) {
            originalLog.apply(console, args);
            addToConsole('LOG', ...args);
        };

        console.error = function (...args) {
            originalError.apply(console, args);
            addToConsole('ERROR', ...args);
        };

        // Test results
        function addTestResult(message, passed) {
            const li = document.createElement('li');
            li.innerHTML = `${passed ? '✅' : '❌'} ${message}`;
            li.style.color = passed ? '#3fb950' : '#f85149';
            testResults.appendChild(li);
        }

        // Wait for module to load
        setTimeout(() => {
            // Clear initial message
            testResults.innerHTML = '';

            // Test 1: Check if button exists
            const btn = document.getElementById('ai-chat-prompt-library-btn');
            addTestResult('Button element found', !!btn);

            // Test 2: Check if dropdown was created
            const dropdown = document.getElementById('inline-prompt-dropdown');
            addTestResult('Dropdown element created', !!dropdown);

            // Test 3: Check if modal was created
            const modal = document.getElementById('prompt-modal-overlay');
            addTestResult('Modal element created', !!modal);

            // Test 4: Check if active prompts bar was created
            const activeBar = document.getElementById('active-prompts-bar');
            addTestResult('Active prompts bar created', !!activeBar);

            // Test 5: Check if global functions exist
            addTestResult('window.togglePromptSelection exists', typeof window.togglePromptSelection === 'function');
            addTestResult('window.openPromptModal exists', typeof window.openPromptModal === 'function');
            addTestResult('window.getSelectedPrompts exists', typeof window.getSelectedPrompts === 'function');

            console.log('[TEST] All checks complete');
        }, 2000);
    </script>

    <script src="modules/prompt-library.js"></script>
</body>

</html>
