<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Animated Gradient + Particles</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* Animated Gradient Background */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg,
                    #0d1117 0%,
                    #1a1f2e 25%,
                    #161b22 50%,
                    #1a1f2e 75%,
                    #0d1117 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            z-index: 1;
        }

        @keyframes gradientShift {

            0%,
            100% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }
        }

        /* Particle Canvas */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            opacity: 0.6;
        }

        /* Content Overlay */
        .content-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* Demo Login Box */
        .login-container {
            background: linear-gradient(145deg, rgba(22, 27, 34, 0.95) 0%, rgba(13, 17, 23, 0.95) 100%);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 20px;
            padding: 48px;
            width: 90%;
            max-width: 480px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.6),
                0 0 1px rgba(255, 255, 255, 0.05) inset;
            backdrop-filter: blur(10px);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            color: #ffffff;
            font-size: 28px;
            /* font-weight: 600; */
            margin-bottom: 8px;
        }

        .login-header p {
            color: #8b949e;
            font-size: 14px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(48, 54, 61, 0.8);
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            margin: 0 auto 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(48, 54, 61, 0.5);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58a6ff, #3fb950);
            border-radius: 2px;
            width: 0%;
            animation: progressGrow 3s ease-in-out infinite;
        }

        @keyframes progressGrow {

            0%,
            100% {
                width: 0%;
            }

            50% {
                width: 100%;
            }
        }

        .demo-label {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #58a6ff;
            font-size: 14px;
            /* font-weight: 600; */
            z-index: 100;
            background: rgba(13, 17, 23, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="demo-label">Option A: Animated Gradient + Particles</div>

    <!-- Animated Gradient Background -->
    <div class="background-container"></div>

    <!-- Particle Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Content -->
    <div class="content-overlay">
        <div class="login-container">
            <div class="login-header">
                <div class="spinner"></div>
                <h1>Business AI Platform</h1>
                <p>Loading your workspace...</p>
            </div>
            <div class="loading-text">Initializing modules...</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        // Particle System
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedY = -Math.random() * 0.5 - 0.1;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.opacity = Math.random() * 0.5 + 0.2;
            }

            update() {
                this.y += this.speedY;
                this.x += this.speedX;

                if (this.y < 0) {
                    this.y = canvas.height;
                    this.x = Math.random() * canvas.width;
                }

                if (this.x < 0 || this.x > canvas.width) {
                    this.x = Math.random() * canvas.width;
                }
            }

            draw() {
                // Brighter particles with glow
                ctx.fillStyle = `rgba(88, 166, 255, ${this.opacity + 0.3})`;
                ctx.shadowBlur = 15;
                ctx.shadowColor = `rgba(88, 166, 255, 0.8)`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();

                // Add bright core
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity * 0.6})`;
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Create particles
        const particles = [];
        const particleCount = 250; // Increased from 100

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        // Animation loop
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>

</html>
