<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Code Rain (Subtle Matrix)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
            background: #0d1117;
        }

        #codeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center,
                    rgba(13, 17, 23, 0.3) 0%,
                    rgba(13, 17, 23, 0.8) 60%,
                    rgba(13, 17, 23, 0.95) 100%);
            z-index: 2;
        }

        .content-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .login-container {
            background: linear-gradient(145deg, rgba(22, 27, 34, 0.98) 0%, rgba(13, 17, 23, 0.98) 100%);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 20px;
            padding: 48px;
            width: 90%;
            max-width: 480px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(15px);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            color: #ffffff;
            font-size: 28px;
            /* font-weight: 600; */
            margin-bottom: 8px;
        }

        .login-header p {
            color: #8b949e;
            font-size: 14px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(48, 54, 61, 0.8);
            border-top: 4px solid #58a6ff;
            border-radius: 50%;
            margin: 0 auto 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-text {
            text-align: center;
            color: #58a6ff;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(48, 54, 61, 0.5);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #58a6ff, #3fb950);
            border-radius: 2px;
            width: 0%;
            animation: progressGrow 3s ease-in-out infinite;
        }

        @keyframes progressGrow {

            0%,
            100% {
                width: 0%;
            }

            50% {
                width: 100%;
            }
        }

        .demo-label {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #58a6ff;
            font-size: 14px;
            /* font-weight: 600; */
            z-index: 100;
            background: rgba(13, 17, 23, 0.9);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(88, 166, 255, 0.3);
        }
    </style>
</head>

<body>
    <div class="demo-label">Alt Matrix 2: Code Snippets (Horizontal)</div>

    <canvas id="codeCanvas"></canvas>
    <div class="gradient-overlay"></div>

    <div class="content-overlay">
        <div class="login-container">
            <div class="login-header">
                <div class="spinner"></div>
                <h1>Business AI Platform</h1>
                <p>Loading your workspace...</p>
            </div>
            <div class="loading-text">Compiling resources...</div>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>

    <script>
        // Horizontal code snippets scrolling (not vertical like Matrix)
        const canvas = document.getElementById('codeCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Code-like strings
        const codeSnippets = [
            'function()', 'const x =', 'return', 'async', 'await',
            'if (true)', 'for (i)', '=> {}', 'import', 'export',
            '.map()', '.filter()', 'class', 'new', 'this.',
            'console.', 'window.', 'document.', 'Promise', 'Array',
            '{ ... }', '[ ... ]', '< />', '0x', 'null', 'undefined'
        ];

        // Color palette
        const colors = [
            { r: 88, g: 166, b: 255 },   // Blue
            { r: 63, g: 185, b: 80 },    // Green
            { r: 255, g: 115, b: 131 },  // Red
            { r: 147, g: 51, b: 234 },   // Purple
            { r: 255, g: 184, b: 77 }    // Orange
        ];

        class CodeLine {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = -200;
                this.y = Math.random() * canvas.height;
                this.speed = 2 + Math.random() * 4; // Much faster: was 0.5-2, now 2-6
                this.text = codeSnippets[Math.floor(Math.random() * codeSnippets.length)];
                this.opacity = 0.5 + Math.random() * 0.5; // Brighter: was 0.2-0.6, now 0.5-1.0
                this.size = 14 + Math.random() * 6; // Bigger: was 12-16, now 14-20
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }

            update() {
                this.x += this.speed;
                if (this.x > canvas.width + 200) {
                    this.reset();
                }
            }

            draw() {
                ctx.font = `${this.size}px "Courier New", monospace`;

                // Glow effect
                ctx.shadowBlur = 10;
                ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.opacity})`;
                ctx.fillText(this.text, this.x, this.y);
                ctx.shadowBlur = 0;
            }
        }

        // Create code lines - MORE of them
        const lines = [];
        for (let i = 0; i < 60; i++) { // Doubled from 30 to 60
            lines.push(new CodeLine());
        }

        function animate() {
            ctx.fillStyle = 'rgba(13, 17, 23, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            lines.forEach(line => {
                line.update();
                line.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>

</html>
