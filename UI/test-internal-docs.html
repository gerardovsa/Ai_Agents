<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Internal Docs - Working Backend</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #ffffff;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
            color: #4f6cff;
        }

        .test-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .test-section h2 {
            margin-bottom: 20px;
            color: #6b8aff;
            font-size: 20px;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #4f6cff 0%, #6b8aff 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 108, 255, 0.4);
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .output {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .success {
            color: #10b981;
        }

        .error {
            color: #ef4444;
        }

        .info {
            color: #6b8aff;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 12px;
        }

        textarea {
            min-height: 120px;
            font-family: 'Courier New', monospace;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1><i class="fas fa-flask"></i> Internal Docs Backend Test</h1>

        <!-- Create Document -->
        <div class="test-section">
            <h2><i class="fas fa-plus-circle"></i> Create Document</h2>

            <label>Session ID:</label>
            <input type="text" id="create-session-id" value="test-session-123" placeholder="Session ID">

            <label>Title:</label>
            <input type="text" id="create-title" value="Test Document" placeholder="Document Title">

            <label>Content:</label>
            <textarea id="create-content" placeholder="Document content..."># Test Document

This is a test document.

## Features
- Feature 1
- Feature 2</textarea>

            <label>Type:</label>
            <select id="create-type"
                style="width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px; color: #ffffff; font-size: 14px; margin-bottom: 12px;">
                <option value="richtext">Rich Text</option>
                <option value="spreadsheet">Spreadsheet</option>
            </select>

            <div class="button-group">
                <button onclick="createDocument()">
                    <i class="fas fa-plus"></i> Create Document
                </button>
                <button class="secondary" onclick="createSpreadsheet()">
                    <i class="fas fa-table"></i> Create Sample Spreadsheet
                </button>
            </div>

            <div id="create-output" class="output"></div>
        </div>

        <!-- Get Document -->
        <div class="test-section">
            <h2><i class="fas fa-file-alt"></i> Get Document</h2>

            <label>Document ID:</label>
            <input type="text" id="get-doc-id" placeholder="int_doc_1234567890" value="">

            <div class="button-group">
                <button onclick="getDocument()">
                    <i class="fas fa-download"></i> Get Document
                </button>
            </div>

            <div id="get-output" class="output"></div>
        </div>

        <!-- List Documents -->
        <div class="test-section">
            <h2><i class="fas fa-list"></i> List Documents</h2>

            <label>Session ID:</label>
            <input type="text" id="list-session-id" value="test-session-123" placeholder="Session ID">

            <div class="button-group">
                <button onclick="listDocuments()">
                    <i class="fas fa-list"></i> List All Documents
                </button>
            </div>

            <div id="list-output" class="output"></div>
        </div>

        <!-- Update Document -->
        <div class="test-section">
            <h2><i class="fas fa-edit"></i> Update Document</h2>

            <label>Document ID:</label>
            <input type="text" id="update-doc-id" placeholder="int_doc_1234567890">

            <label>New Title:</label>
            <input type="text" id="update-title" placeholder="Updated Title">

            <label>New Content:</label>
            <textarea id="update-content" placeholder="Updated content..."></textarea>

            <div class="button-group">
                <button onclick="updateDocument()">
                    <i class="fas fa-save"></i> Update Document
                </button>
            </div>

            <div id="update-output" class="output"></div>
        </div>

        <!-- Export Document -->
        <div class="test-section">
            <h2><i class="fas fa-download"></i> Export Document</h2>

            <label>Document ID:</label>
            <input type="text" id="export-doc-id" placeholder="int_doc_1234567890">

            <div class="button-group">
                <button onclick="exportDocument('markdown')">
                    <i class="fab fa-markdown"></i> Export as Markdown
                </button>
                <button onclick="exportDocument('html')">
                    <i class="fas fa-code"></i> Export as HTML
                </button>
                <button onclick="exportDocument('csv')">
                    <i class="fas fa-file-csv"></i> Export as CSV
                </button>
            </div>

            <div id="export-output" class="output"></div>
        </div>

        <!-- Link to AI -->
        <div class="test-section">
            <h2><i class="fas fa-link"></i> Link to AI Session</h2>

            <label>Document ID:</label>
            <input type="text" id="link-doc-id" placeholder="int_doc_1234567890">

            <label>AI Session ID:</label>
            <input type="text" id="link-session-id" value="ai-session-456" placeholder="AI Session ID">

            <div class="button-group">
                <button onclick="linkToAI()">
                    <i class="fas fa-link"></i> Link to AI
                </button>
            </div>

            <div id="link-output" class="output"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5001/api/synergy';

        let lastCreatedDocId = null;

        function log(outputId, message, type = 'info') {
            const output = document.getElementById(outputId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            output.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }

        function clearLog(outputId) {
            document.getElementById(outputId).innerHTML = '';
        }

        async function createDocument() {
            clearLog('create-output');

            const sessionId = document.getElementById('create-session-id').value;
            const title = document.getElementById('create-title').value;
            const content = document.getElementById('create-content').value;
            const docType = document.getElementById('create-type').value;

            if (!sessionId || !title) {
                log('create-output', 'Session ID and Title are required', 'error');
                return;
            }

            log('create-output', 'Creating document...', 'info');

            try {
                const response = await fetch(`${API_BASE}/internal-doc/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        title: title,
                        content: content,
                        doc_type: docType,
                        format: 'markdown',
                        created_by: 'test-user'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    lastCreatedDocId = data.doc_id;
                    log('create-output', `✅ Document created successfully!`, 'success');
                    log('create-output', `Doc ID: ${data.doc_id}`, 'success');
                    log('create-output', JSON.stringify(data, null, 2), 'info');

                    // Auto-fill get and update fields
                    document.getElementById('get-doc-id').value = data.doc_id;
                    document.getElementById('update-doc-id').value = data.doc_id;
                    document.getElementById('export-doc-id').value = data.doc_id;
                    document.getElementById('link-doc-id').value = data.doc_id;
                } else {
                    log('create-output', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log('create-output', `❌ Request failed: ${error.message}`, 'error');
            }
        }

        async function createSpreadsheet() {
            clearLog('create-output');

            const sessionId = document.getElementById('create-session-id').value;

            log('create-output', 'Creating sample spreadsheet...', 'info');

            const spreadsheetData = [
                ['Item', 'Cost', 'Qty', 'Total'],
                ['Laptop', 1200, 5, '=B2*C2'],
                ['Monitor', 300, 10, '=B3*C3'],
                ['Keyboard', 50, 20, '=B4*C4'],
                ['', '', 'Total:', '=SUM(D2:D4)']
            ];

            try {
                const response = await fetch(`${API_BASE}/internal-doc/create`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        title: 'Budget Calculator',
                        content: JSON.stringify(spreadsheetData),
                        content_json: JSON.stringify(spreadsheetData),
                        doc_type: 'spreadsheet',
                        format: 'json',
                        created_by: 'test-user'
                    })
                });

                const data = await response.json();

                if (data.success) {
                    lastCreatedDocId = data.doc_id;
                    log('create-output', `✅ Spreadsheet created successfully!`, 'success');
                    log('create-output', `Doc ID: ${data.doc_id}`, 'success');
                    log('create-output', JSON.stringify(data, null, 2), 'info');

                    // Auto-fill fields
                    document.getElementById('get-doc-id').value = data.doc_id;
                    document.getElementById('export-doc-id').value = data.doc_id;
                } else {
                    log('create-output', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log('create-output', `❌ Request failed: ${error.message}`, 'error');
            }
        }

        async function getDocument() {
            clearLog('get-output');

            const docId = document.getElementById('get-doc-id').value;

            if (!docId) {
                log('get-output', 'Document ID is required', 'error');
                return;
            }

            log('get-output', `Fetching document ${docId}...`, 'info');

            try {
                const response = await fetch(`${API_BASE}/internal-doc/${docId}`);
                const data = await response.json();

                if (data.success) {
                    log('get-output', `✅ Document retrieved successfully!`, 'success');
                    log('get-output', JSON.stringify(data, null, 2), 'info');
                } else {
                    log('get-output', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log('get-output', `❌ Request failed: ${error.message}`, 'error');
            }
        }

        async function listDocuments() {
            clearLog('list-output');

            const sessionId = document.getElementById('list-session-id').value;

            if (!sessionId) {
                log('list-output', 'Session ID is required', 'error');
                return;
            }

            log('list-output', `Fetching documents for session ${sessionId}...`, 'info');

            try {
                const response = await fetch(`${API_BASE}/internal-doc/list/${sessionId}`);
                const data = await response.json();

                if (data.success) {
                    log('list-output', `✅ Found ${data.count} documents`, 'success');
                    log('list-output', JSON.stringify(data, null, 2), 'info');
                } else {
                    log('list-output', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log('list-output', `❌ Request failed: ${error.message}`, 'error');
            }
        }

        async function updateDocument() {
            clearLog('update-output');

            const docId = document.getElementById('update-doc-id').value;
            const title = document.getElementById('update-title').value;
            const content = document.getElementById('update-content').value;

            if (!docId) {
                log('update-output', 'Document ID is required', 'error');
                return;
            }

            if (!title && !content) {
                log('update-output', 'Title or Content is required', 'error');
                return;
            }

            log('update-output', `Updating document ${docId}...`, 'info');

            try {
                const body = {};
                if (title) body.title = title;
                if (content) body.content = content;

                const response = await fetch(`${API_BASE}/internal-doc/${docId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (data.success) {
                    log('update-output', `✅ Document updated successfully!`, 'success');
                    log('update-output', `New version: ${data.version}`, 'success');
                    log('update-output', JSON.stringify(data, null, 2), 'info');
                } else {
                    log('update-output', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log('update-output', `❌ Request failed: ${error.message}`, 'error');
            }
        }

        async function exportDocument(format) {
            clearLog('export-output');

            const docId = document.getElementById('export-doc-id').value;

            if (!docId) {
                log('export-output', 'Document ID is required', 'error');
                return;
            }

            log('export-output', `Exporting document as ${format}...`, 'info');

            try {
                const response = await fetch(`${API_BASE}/internal-doc/${docId}/export/${format}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: 1 })
                });

                if (format === 'markdown' || format === 'html' || format === 'csv') {
                    // Download file
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `document.${format === 'markdown' ? 'md' : format}`;
                    a.click();

                    log('export-output', `✅ File downloaded as ${a.download}`, 'success');
                } else {
                    const data = await response.json();
                    log('export-output', JSON.stringify(data, null, 2), 'info');
                }
            } catch (error) {
                log('export-output', `❌ Request failed: ${error.message}`, 'error');
            }
        }

        async function linkToAI() {
            clearLog('link-output');

            const docId = document.getElementById('link-doc-id').value;
            const sessionId = document.getElementById('link-session-id').value;

            if (!docId || !sessionId) {
                log('link-output', 'Document ID and Session ID are required', 'error');
                return;
            }

            log('link-output', `Linking document to AI session...`, 'info');

            try {
                const response = await fetch(`${API_BASE}/internal-doc/${docId}/link-ai`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: sessionId,
                        user_id: 1
                    })
                });

                const data = await response.json();

                if (data.success) {
                    log('link-output', `✅ Document linked to AI session!`, 'success');
                    log('link-output', JSON.stringify(data, null, 2), 'info');
                } else {
                    log('link-output', `❌ Error: ${data.error}`, 'error');
                }
            } catch (error) {
                log('link-output', `❌ Request failed: ${error.message}`, 'error');
            }
        }

        console.log('✅ Internal Docs Backend Test loaded');
        console.log('API Base:', API_BASE);
    </script>
</body>

</html>
