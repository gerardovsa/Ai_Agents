<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Initializing Business AI Platform</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #1c2128;
            --accent-primary: #58a6ff;
            --accent-success: #3fb950;
            --text-primary: #f3f4f6;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --border-default: #30363d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 48px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .logo {
            font-size: 64px;
            margin-bottom: 24px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        h1 {
            font-size: 28px;
            /* font-weight: 600; */
            color: var(--text-primary);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 32px 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--bg-tertiary);
            border-top: 3px solid var(--accent-primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .status-text {
            font-size: 16px;
            color: var(--text-secondary);
            /* font-weight: 500; */
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background: var(--bg-tertiary);
            border-radius: 2px;
            overflow: hidden;
            margin: 24px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-success));
            border-radius: 2px;
            animation: progress 2s ease-in-out;
        }

        @keyframes progress {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        .details {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 24px;
            padding: 16px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .detail-icon {
            font-size: 16px;
        }

        .version {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Fira Code', 'Consolas', monospace;
            letter-spacing: 0.5px;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">🚀</div>
        <h1>Preparing Your Browser Environment</h1>

        <div class="status">
            <div class="spinner"></div>
            <span class="status-text">Optimizing cache protocols...</span>
        </div>

        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>

        <div class="details">
            <div class="detail-item">
                <span class="detail-icon">⚡</span>
                <span>Refreshing application state</span>
            </div>
            <div class="detail-item">
                <span class="detail-icon">🔄</span>
                <span>Loading enhanced modules</span>
            </div>
            <div class="detail-item">
                <span class="detail-icon">🎯</span>
                <span>Initializing Synergy Dashboard v2.1</span>
            </div>
        </div>

        <div class="version">SYSTEM.VERSION.2.1.0 • BUILD.NOV.2025</div>
    </div>

    <script>
        // Add timestamp to force cache bypass
        const timestamp = new Date().getTime();
        const url = `business-ai-platform-v2.html?v=2.1&t=${timestamp}`;

        console.log('%c🔧 CACHE BUSTER ACTIVE', 'background: #f59e0b; color: white; padding: 8px; font-weight: bold;');
        console.log('Redirecting with cache-busting parameters...');
        console.log('URL:', url);

        // Redirect after 2 seconds
        setTimeout(() => {
            window.location.href = url;
        }, 2000);
    </script>
</body>

</html>
