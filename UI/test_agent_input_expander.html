<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Input Container Diagnostic</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        #diagnostic-output {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            white-space: pre-wrap;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-section {
            margin: 10px 0;
            padding: 10px;
            background: #333;
            border-left: 3px solid #58a6ff;
        }

        .error {
            border-left-color: #f85149;
        }

        .success {
            border-left-color: #3fb950;
        }

        .warning {
            border-left-color: #d29922;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            background: #58a6ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #539bf5;
        }
    </style>
</head>

<body>
    <h1>🔍 Agent Input Container Diagnostic Tool</h1>

    <div>
        <button onclick="runDiagnostic(3)">🔬 Diagnose Agent 3 Container</button>
        <button onclick="testExpand(3)">🔄 Test Expand Agent 3</button>
        <button onclick="simulateClick(3)">👆 Simulate Click on Agent 3</button>
        <button onclick="clearOutput()">🗑️ Clear Output</button>
    </div>

    <div id="diagnostic-output"></div>

    <script>
        const output = document.getElementById('diagnostic-output');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `log-section ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            output.appendChild(div);
            output.scrollTop = output.scrollHeight;
        }

        function clearOutput() {
            output.innerHTML = '';
        }

        function runDiagnostic(agentId) {
            log('='.repeat(60), 'info');
            log(`🔍 DIAGNOSTIC START: Agent ${agentId}`, 'info');
            log('='.repeat(60), 'info');

            // 1. Find the container
            const container = document.querySelector(`#agent-column-${agentId} .agent-input-container`);

            if (!container) {
                log(`❌ ERROR: Container not found with selector: #agent-column-${agentId} .agent-input-container`, 'error');

                // Try alternative selectors
                log('\n🔍 Searching for alternative selectors...', 'info');
                const altContainer1 = document.querySelector(`.agent-input-container[data-agent-id="${agentId}"]`);
                const altContainer2 = document.querySelector(`[data-agent-id="${agentId}"]`);

                log(`  .agent-input-container[data-agent-id="${agentId}"]: ${altContainer1 ? '✅ FOUND' : '❌ NOT FOUND'}`, altContainer1 ? 'success' : 'error');
                log(`  [data-agent-id="${agentId}"]: ${altContainer2 ? '✅ FOUND' : '❌ NOT FOUND'}`, altContainer2 ? 'success' : 'error');

                return;
            }

            log(`✅ Container found!`, 'success');
            log(`   Selector: #agent-column-${agentId} .agent-input-container`, 'success');

            // 2. Get computed styles
            const computedStyle = window.getComputedStyle(container);

            log('\n📊 COMPUTED STYLES:', 'info');
            log(`   display: ${computedStyle.display}`, 'info');
            log(`   height: ${computedStyle.height}`, 'info');
            log(`   overflow: ${computedStyle.overflow}`, 'info');
            log(`   cursor: ${computedStyle.cursor}`, 'info');
            log(`   position: ${computedStyle.position}`, 'info');
            log(`   padding: ${computedStyle.padding}`, 'info');
            log(`   background: ${computedStyle.background}`, 'info');
            log(`   pointer-events: ${computedStyle.pointerEvents}`, 'info');
            log(`   z-index: ${computedStyle.zIndex}`, 'info');
            log(`   opacity: ${computedStyle.opacity}`, 'info');

            // 3. Check classes
            log('\n📝 CLASSES:', 'info');
            log(`   classList: ${container.className}`, 'info');
            log(`   Has 'expanded': ${container.classList.contains('expanded') ? '✅ YES' : '❌ NO'}`, container.classList.contains('expanded') ? 'success' : 'warning');

            // 4. Check dimensions
            log('\n📏 DIMENSIONS:', 'info');
            log(`   offsetHeight: ${container.offsetHeight}px`, 'info');
            log(`   offsetWidth: ${container.offsetWidth}px`, 'info');
            log(`   scrollHeight: ${container.scrollHeight}px`, 'info');
            log(`   clientHeight: ${container.clientHeight}px`, 'info');
            const rect = container.getBoundingClientRect();
            log(`   getBoundingClientRect:`, 'info');
            log(`     top: ${rect.top}, left: ${rect.left}`, 'info');
            log(`     width: ${rect.width}, height: ${rect.height}`, 'info');
            log(`     visible: ${rect.width > 0 && rect.height > 0 ? '✅ YES' : '❌ NO'}`, rect.width > 0 && rect.height > 0 ? 'success' : 'error');

            // 5. Check child elements
            log('\n👶 CHILD ELEMENTS:', 'info');
            const feedbackArea = container.querySelector('.agent-feedback-container');
            const inputWrapper = container.querySelector('.agent-input-wrapper');
            const textarea = container.querySelector('.agent-input-textarea');

            log(`   .agent-feedback-container: ${feedbackArea ? '✅ FOUND' : '❌ NOT FOUND'}`, feedbackArea ? 'success' : 'error');
            if (feedbackArea) {
                const fbStyle = window.getComputedStyle(feedbackArea);
                log(`     display: ${fbStyle.display}, opacity: ${fbStyle.opacity}`, 'info');
            }

            log(`   .agent-input-wrapper: ${inputWrapper ? '✅ FOUND' : '❌ NOT FOUND'}`, inputWrapper ? 'success' : 'error');
            if (inputWrapper) {
                const iwStyle = window.getComputedStyle(inputWrapper);
                log(`     display: ${iwStyle.display}, opacity: ${iwStyle.opacity}, pointer-events: ${iwStyle.pointerEvents}`, 'info');
            }

            log(`   .agent-input-textarea: ${textarea ? '✅ FOUND' : '❌ NOT FOUND'}`, textarea ? 'success' : 'error');

            // 6. Check event listeners
            log('\n👂 EVENT LISTENERS:', 'info');
            log(`   Note: Cannot inspect event listeners directly from here`, 'warning');
            log(`   Check console for AgentInput.setupHandlers(${agentId}) logs`, 'info');

            // 7. Check AgentInput state
            log('\n🔧 AGENT INPUT STATE:', 'info');
            if (typeof AgentInput !== 'undefined') {
                log(`   AgentInput object: ✅ EXISTS`, 'success');
                // Try to access state (may not work if private)
                log(`   Check browser console: window.AgentInput`, 'info');
            } else {
                log(`   AgentInput object: ❌ NOT FOUND`, 'error');
            }

            // 8. Check if CSS file is loaded
            log('\n📄 CSS FILES:', 'info');
            const stylesheets = Array.from(document.styleSheets);
            const agentUiCss = stylesheets.find(sheet => {
                try {
                    return sheet.href && sheet.href.includes('agent-ui.css');
                } catch (e) {
                    return false;
                }
            });
            log(`   agent-ui.css loaded: ${agentUiCss ? '✅ YES' : '❌ NO'}`, agentUiCss ? 'success' : 'error');

            // 9. Check for conflicting styles
            log('\n⚠️ STYLE CONFLICTS:', 'info');
            const allStyles = [
                { prop: 'height', expected: '30px' },
                { prop: 'cursor', expected: 'pointer' },
                { prop: 'overflow', expected: 'hidden' },
                { prop: 'pointer-events', expected: 'auto' }
            ];

            allStyles.forEach(({ prop, expected }) => {
                const actual = computedStyle[prop];
                const match = actual === expected;
                log(`   ${prop}: ${actual} ${match ? '✅' : `⚠️ (expected: ${expected})`}`, match ? 'success' : 'warning');
            });

            log('\n' + '='.repeat(60), 'info');
            log('🏁 DIAGNOSTIC COMPLETE', 'info');
            log('='.repeat(60), 'info');
        }

        function testExpand(agentId) {
            log('\n🔄 TESTING EXPAND FUNCTION...', 'info');

            if (typeof AgentInput === 'undefined') {
                log('❌ AgentInput not found in window scope', 'error');
                return;
            }

            if (typeof AgentInput.expand !== 'function') {
                log('❌ AgentInput.expand is not a function', 'error');
                return;
            }

            try {
                log(`   Calling AgentInput.expand(${agentId})...`, 'info');
                AgentInput.expand(agentId);

                setTimeout(() => {
                    const container = document.querySelector(`#agent-column-${agentId} .agent-input-container`);
                    if (container) {
                        const hasExpanded = container.classList.contains('expanded');
                        log(`   Result: ${hasExpanded ? '✅ EXPANDED' : '❌ NOT EXPANDED'}`, hasExpanded ? 'success' : 'error');
                        log(`   Height: ${container.offsetHeight}px`, 'info');
                        log(`   Classes: ${container.className}`, 'info');
                    }
                }, 150);
            } catch (error) {
                log(`❌ Error calling expand: ${error.message}`, 'error');
            }
        }

        function simulateClick(agentId) {
            log('\n👆 SIMULATING CLICK EVENT...', 'info');

            const container = document.querySelector(`#agent-column-${agentId} .agent-input-container`);

            if (!container) {
                log('❌ Container not found', 'error');
                return;
            }

            // Create and dispatch click event
            const clickEvent = new MouseEvent('click', {
                bubbles: true,
                cancelable: true,
                view: window
            });

            log(`   Dispatching click event to container...`, 'info');
            const dispatched = container.dispatchEvent(clickEvent);
            log(`   Event dispatched: ${dispatched ? '✅ YES' : '❌ NO'}`, dispatched ? 'success' : 'error');

            setTimeout(() => {
                const hasExpanded = container.classList.contains('expanded');
                log(`   Container expanded after click: ${hasExpanded ? '✅ YES' : '❌ NO'}`, hasExpanded ? 'success' : 'error');
                log(`   Height: ${container.offsetHeight}px`, 'info');
            }, 150);
        }

        // Auto-run diagnostic on load
        setTimeout(() => {
            log('🚀 Page loaded - Run diagnostic to check Agent 3 container', 'info');
            log('💡 TIP: Open browser DevTools Console to see AgentInput logs', 'warning');
        }, 500);
    </script>
</body>

</html>
