<!DOCTYPE html>
<html>
<head>
    <title>Quick Module Check</title>
    <style>
        body { 
            background: #1a1a1a; 
            color: #fff; 
            font-family: monospace; 
            padding: 20px;
        }
        .status { padding: 10px; margin: 5px; border-radius: 4px; }
        .ok { background: #2d5016; }
        .fail { background: #5c1010; }
        button { 
            padding: 10px 20px; 
            margin: 10px 5px; 
            background: #0078d4; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Module System Quick Check</h1>
    <div id="output"></div>
    <button onclick="checkNow()">Check Now</button>
    <button onclick="location.href='/'">Go to Main App</button>
    
    <script>
        function checkNow() {
            const output = document.getElementById('output');
            output.innerHTML = '<h2>Checking...</h2>';
            
            fetch('/external/modules/manifest.json')
                .then(r => r.json())
                .then(manifest => {
                    const kanban = manifest.modules.find(m => m.id === 'inhouse-kanban');
                    output.innerHTML += `<div class="status ok">✅ Manifest OK: ${manifest.modules.length} modules</div>`;
                    output.innerHTML += `<div class="status ${kanban && kanban.enabled ? 'ok' : 'fail'}">
                        ${kanban && kanban.enabled ? '✅' : '❌'} InHouse Kanban: ${kanban ? (kanban.enabled ? 'ENABLED' : 'DISABLED') : 'NOT FOUND'}
                    </div>`;
                    
                    // Check if main page has module system
                    output.innerHTML += `<h3>Now open browser console (F12) on main page and run:</h3>`;
                    output.innerHTML += `<pre style="background: #000; padding: 15px; border-radius: 4px;">
// Check if ModuleManager exists and is initialized
console.log('ModuleManager:', window.ModuleManager);
console.log('Sidebar:', window.ModuleManager?.sidebar);
console.log('Modules:', window.ModuleManager?.getModules());

// Check for inhouse-kanban specifically
const modules = window.ModuleManager?.getModules() || [];
const kanban = modules.find(m => m.id === 'inhouse-kanban');
console.log('InHouse Kanban:', kanban);

// Check if sidebar button exists
const button = document.querySelector('[data-tab="inhouse-kanban"]');
console.log('Sidebar button:', button);

// Check sidebar modules section
const section = document.getElementById('sidebarModulesSection');
console.log('Sidebar modules section:', section);
console.log('Buttons in section:', section?.children.length);
</pre>`;
                })
                .catch(err => {
                    output.innerHTML += `<div class="status fail">❌ Error: ${err.message}</div>`;
                });
        }
        
        checkNow();
    </script>
</body>
</html>
