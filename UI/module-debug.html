<!DOCTYPE html>
<html>

<head>
    <title>Module System Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }

        .section {
            background: #2a2a2a;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .pass {
            color: #0f0;
        }

        .fail {
            color: #f00;
        }

        .warn {
            color: #ff0;
        }
    </style>
</head>

<body>
    <h1>Module System Diagnostic</h1>
    <div id="results"></div>

    <script>
        const results = document.getElementById('results');

        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = 'section';
            const span = document.createElement('span');
            span.className = type;
            span.textContent = `[${type.toUpperCase()}] ${message}`;
            div.appendChild(span);
            results.appendChild(div);
            console.log(message);
        }

        async function runDiagnostics() {
            log('Starting diagnostics...', 'info');

            // Test 1: Check if running via HTTP
            log(`Protocol: ${window.location.protocol}`, window.location.protocol === 'file:' ? 'warn' : 'pass');

            // Test 2: Check if manifest exists
            try {
                const response = await fetch('external/modules/manifest.json');
                if (response.ok) {
                    const manifest = await response.json();
                    log(`Manifest loaded: ${manifest.modules.length} modules found`, 'pass');

                    // List modules
                    manifest.modules.forEach(mod => {
                        log(`  - ${mod.name} (${mod.enabled ? 'enabled' : 'disabled'})`, mod.enabled ? 'pass' : 'warn');
                    });
                } else {
                    log(`Manifest fetch failed: HTTP ${response.status}`, 'fail');
                }
            } catch (error) {
                log(`Manifest error: ${error.message}`, 'fail');
            }

            // Test 3: Check for sidebar element
            const sidebar = document.querySelector('.sidebar');
            log(`Sidebar element: ${sidebar ? 'Found' : 'Not found'}`, sidebar ? 'pass' : 'fail');

            // Test 4: Check for main-content element
            const mainContent = document.querySelector('.main-content');
            log(`Main content element: ${mainContent ? 'Found' : 'Not found'}`, mainContent ? 'pass' : 'fail');

            // Test 5: Try loading a module script
            try {
                const testModule = 'external/modules/shopify/shopify.js';
                const response = await fetch(testModule, { method: 'HEAD' });
                log(`Test module (Shopify) accessible: ${response.ok}`, response.ok ? 'pass' : 'fail');
            } catch (error) {
                log(`Test module error: ${error.message}`, 'fail');
            }

            log('Diagnostics complete!', 'info');
        }

        // Add mock elements for testing
        const sidebar = document.createElement('div');
        sidebar.className = 'sidebar';
        document.body.appendChild(sidebar);

        const mainContent = document.createElement('div');
        mainContent.className = 'main-content';
        document.body.appendChild(mainContent);

        runDiagnostics();
    </script>
</body>

</html>
