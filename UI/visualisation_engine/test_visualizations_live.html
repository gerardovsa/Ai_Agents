<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Visualization Tester - Side by Side</title>

    <!-- Import CSS Dependencies -->
    <link rel="stylesheet" href="../modules_internal/agents/agent-ui.css">
    <link rel="stylesheet" href="./visualization_enhancements.css">
    <link rel="stylesheet" href="../shared/styles/code-blocks.css">
    <link rel="stylesheet"
        href="../../docs/Fontawesome/fontawesome-free-7.1.0-web/fontawesome-free-7.1.0-web/css/all.min.css">

    <!-- Chart Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.27.1/plotly.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.45.1/dist/apexcharts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>

    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --bg-tertiary: #e9ecef;
            --text-primary: #24292f;
            --text-secondary: #57606a;
            --border-color: #d0d7de;
            --accent-primary: #677eea;
            --success: #2da44e;
            --warning: #bf8700;
            --error: #cf222e;
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --border-color: #30363d;
            --accent-primary: #677eea;
            --success: #3fb950;
            --warning: #d29922;
            --error: #f85149;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        .header {
            background: var(--bg-secondary);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .header h1 {
            color: var(--accent-primary);
            margin-bottom: 10px;
            font-size: 24px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-warning {
            background: var(--warning);
            color: white;
        }

        .btn-info {
            background: #0969da;
            color: white;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .column {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .column h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        select,
        textarea {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            color: var(--text-primary);
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        textarea {
            width: 100%;
            min-width: 600px;
        }

        select {
            cursor: pointer;
        }

        textarea {
            min-height: 400px;
            resize: vertical;
            font-size: 12px;
            line-height: 1.5;
        }

        .output-area {
            min-height: 450px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
        }

        .message-bubble {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
        }

        .message-bubble.ai-message {
            border-left: 3px solid var(--accent-primary);
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .message-content {
            color: var(--text-primary);
        }

        .viz-container {
            margin-top: 10px;
        }

        .viz-content-area {
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 15px;
            min-height: 300px;
        }

        .console-log {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .console-log .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .console-log .log-entry:last-child {
            border-bottom: none;
        }

        .log-info {
            color: #58a6ff;
        }

        .log-success {
            color: var(--success);
        }

        .log-error {
            color: var(--error);
        }

        .log-warn {
            color: var(--warning);
        }

        .copy-log-btn {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
            float: right;
        }

        .copy-log-btn:hover {
            opacity: 0.8;
        }

        @media (max-width: 1200px) {
            .two-column {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-line"></i> Live Visualization Tester</h1>
            <p style="color: var(--text-secondary); margin-top: 5px;">
                Enter raw visualization config with delimiters on the left, see rendered output on the right
            </p>
            <div class="controls">
                <button onclick="renderVisualization()" class="btn btn-primary">
                    <i class="fas fa-magic"></i> Render Visualization
                </button>
                <button onclick="clearOutput()" class="btn btn-warning">
                    <i class="fas fa-trash"></i> Clear Output
                </button>
                <button onclick="toggleTheme()" class="btn btn-info" id="themeToggle">
                    <i class="fas fa-moon"></i> Toggle Theme
                </button>
                <button onclick="loadSample('chartjs')" class="btn btn-secondary">Chart.js Sample</button>
                <button onclick="loadSample('plotly')" class="btn btn-secondary">Plotly Sample</button>
                <button onclick="loadSample('apexcharts')" class="btn btn-secondary">ApexCharts Sample</button>
                <button onclick="loadSample('threejs')" class="btn btn-secondary">Three.js Sample</button>
                <button onclick="loadSample('gsap')" class="btn btn-secondary">GSAP Sample</button>
                <button onclick="loadSample('mermaid')" class="btn btn-secondary">Mermaid Sample</button>
                <button onclick="loadSample('multi')" class="btn btn-secondary"
                    style="background: var(--accent-primary); color: white;">
                    <i class="fas fa-layer-group"></i> Multi-Viz Sample
                </button>
                <button onclick="loadAllSamples()" class="btn btn-secondary"
                    style="background: var(--success); color: white;">
                    <i class="fas fa-rocket"></i> Test All Samples
                </button>
            </div>
        </div>

        <div class="two-column">
            <!-- Left Column: Input -->
            <div class="column">
                <h2><i class="fas fa-edit"></i> Raw Input</h2>
                <div class="input-section">
                    <div>
                        <label for="inputMode">Input Mode:</label>
                        <select id="inputMode" onchange="switchInputMode()">
                            <option value="single">Single Visualization (with delimiters)</option>
                            <option value="multi">Full AI Response (mixed content + multiple visualizations)</option>
                        </select>
                    </div>
                    <div id="singleModeControls">
                        <label for="vizType">Visualization Type:</label>
                        <select id="vizType" onchange="updateDelimiters()">
                            <option value="CHARTJS">Chart.js</option>
                            <option value="PLOTLY">Plotly</option>
                            <option value="APEXCHARTS">ApexCharts</option>
                            <option value="THREEJS">Three.js</option>
                            <option value="GSAP">GSAP Animation</option>
                            <option value="MERMAID">Mermaid Diagram</option>
                            <option value="CAD">CAD/3D Model</option>
                            <option value="LOTTIE">Lottie Animation</option>
                            <option value="SVG">SVG Graphic</option>
                            <option value="HTML">HTML Content</option>
                        </select>
                    </div>
                    <div>
                        <label for="rawInput" style="display: block; margin-bottom: 5px;">
                            <span id="inputLabel">Config (with delimiters):</span>
                        </label>
                        <div style="color: var(--text-secondary); font-size: 12px; margin-bottom: 8px;"
                            id="delimiterHint"></div>
                        <textarea id="rawInput"
                            placeholder="Paste your visualization config here with delimiters..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Right Column: Rendered Output -->
            <div class="column">
                <h2><i class="fas fa-eye"></i> Rendered Output</h2>
                <div id="outputArea" class="output-area">
                    <div style="text-align: center; color: var(--text-secondary); padding: 50px 20px;">
                        <i class="fas fa-arrow-left" style="font-size: 48px; opacity: 0.3;"></i>
                        <p style="margin-top: 20px;">Enter config on the left and click "Render Visualization"</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Console Log -->
        <div class="console-log" id="consoleLog">
            <div style="color: var(--text-secondary); margin-bottom: 10px;">
                <i class="fas fa-terminal"></i> Console Output
                <button onclick="copyAllLogs()" class="copy-log-btn">
                    <i class="fas fa-copy"></i> Copy All
                </button>
            </div>
        </div>
    </div>

    <!-- Load Base Renderer & Visualization Engine -->
    <script src="./base_renderer.js"></script>
    <script src="./visualisation_v3.js"></script>

    <!-- Additional Renderers (if separate files) -->
    <script src="./apexcharts_renderer.js"></script>
    <script src="./threejs_renderer.js"></script>
    <script src="./gsap_renderer.js"></script>
    <script src="./cad_renderer.js"></script>

    <script>
        // ThemeDetector mock for standalone testing
        window.ThemeDetector = {
            isDark: () => document.documentElement.getAttribute('data-theme') === 'dark',
            getColors: () => {
                const isDark = ThemeDetector.isDark();
                return {
                    background: isDark ? '#0d1117' : '#ffffff',
                    backgroundSecondary: isDark ? '#161b22' : '#f5f5f5',
                    text: isDark ? '#e6edf3' : '#24292f',
                    textSecondary: isDark ? '#8b949e' : '#57606a',
                    border: isDark ? '#30363d' : '#d0d7de',
                    accent: '#677eea'
                };
            }
        };

        // Console logger
        function logConsole(message, type = 'info') {
            const logDiv = document.getElementById('consoleLog');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;

            const timestamp = new Date().toLocaleTimeString();
            const icon = type === 'error' ? '❌' : type === 'success' ? '✅' : type === 'warn' ? '⚠️' : 'ℹ️';

            entry.innerHTML = `<span style="color: var(--text-secondary)">[${timestamp}]</span> ${icon} ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;

        console.log = function (...args) {
            logConsole(args.join(' '), 'info');
            originalLog.apply(console, args);
        };

        console.error = function (...args) {
            logConsole(args.join(' '), 'error');
            originalError.apply(console, args);
        };

        console.warn = function (...args) {
            logConsole(args.join(' '), 'warn');
            originalWarn.apply(console, args);
        };

        // Switch input mode
        function switchInputMode() {
            const mode = document.getElementById('inputMode').value;
            const singleModeControls = document.getElementById('singleModeControls');
            const inputLabel = document.getElementById('inputLabel');
            const delimiterHint = document.getElementById('delimiterHint');
            const rawInput = document.getElementById('rawInput');

            if (mode === 'single') {
                singleModeControls.style.display = 'block';
                inputLabel.textContent = 'Config (with delimiters):';
                rawInput.placeholder = 'Paste your visualization config here with delimiters...';
                updateDelimiters();
            } else {
                singleModeControls.style.display = 'none';
                inputLabel.textContent = 'Full AI Response:';
                delimiterHint.textContent = 'Can contain text, code blocks, and multiple visualizations';
                rawInput.placeholder = 'Paste entire AI response with mixed content...\n\nExample:\nHere is your sales analysis:\n\n<CHARTJS>\n{ "type": "bar", ... }\n</CHARTJS>\n\nAnd the 3D model:\n\n<THREEJS>\n{ "scene": {...} }\n</THREEJS>';
            }
        }

        // Update delimiter hint
        function updateDelimiters() {
            const vizType = document.getElementById('vizType').value;
            const hint = document.getElementById('delimiterHint');
            hint.textContent = `Use <${vizType}> ... </${vizType}> delimiters`;
        }

        // Initialize
        updateDelimiters();

        // Parse mixed content into sections (text and visualizations)
        function parseFullAIResponse(content) {
            const sections = [];

            // Define all visualization types and their delimiters
            const vizTypes = [
                'CHARTJS', 'PLOTLY', 'APEXCHARTS', 'THREEJS', 'GSAP',
                'MERMAID', 'CAD', 'LOTTIE', 'SVG', 'HTML', 'LATEX',
                'SCHEMATIC', 'ANIMATION'
            ];

            // Find all visualization blocks with their positions
            const allMatches = [];

            vizTypes.forEach(type => {
                const regex = new RegExp(`<${type}>[\\s\\S]*?<\\/${type}>`, 'gi');
                let match;

                while ((match = regex.exec(content)) !== null) {
                    allMatches.push({
                        type: type,
                        fullMatch: match[0],
                        startIndex: match.index,
                        endIndex: match.index + match[0].length,
                        content: match[0].match(new RegExp(`<${type}>([\\s\\S]*?)<\\/${type}>`, 'i'))[1].trim()
                    });
                }
            });

            // Sort by position
            allMatches.sort((a, b) => a.startIndex - b.startIndex);

            console.log(`DEBUG: Found ${allMatches.length} visualization blocks`);
            allMatches.forEach((m, i) => console.log(`  ${i + 1}. ${m.type} at position ${m.startIndex}`));

            // Build sections alternating between text and visualizations
            let lastIndex = 0;

            allMatches.forEach((match, idx) => {
                // Add text before this visualization (if any)
                if (match.startIndex > lastIndex) {
                    const textContent = content.substring(lastIndex, match.startIndex).trim();
                    if (textContent) {
                        sections.push({
                            type: 'text',
                            content: textContent
                        });
                    }
                }

                // Add visualization
                sections.push({
                    type: 'visualization',
                    vizType: match.type,
                    content: match.fullMatch,
                    rawContent: match.content
                });

                lastIndex = match.endIndex;
            });

            // Add any remaining text after last visualization
            if (lastIndex < content.length) {
                const textContent = content.substring(lastIndex).trim();
                if (textContent) {
                    sections.push({
                        type: 'text',
                        content: textContent
                    });
                }
            }

            return sections;
        }

        // Render visualization through the engine
        async function renderVisualization() {
            const rawInput = document.getElementById('rawInput').value.trim();
            const inputMode = document.getElementById('inputMode').value;
            const outputArea = document.getElementById('outputArea');

            if (!rawInput) {
                logConsole('No input provided', 'warn');
                return;
            }

            // Clear output
            outputArea.innerHTML = '';

            if (inputMode === 'multi') {
                // Multi-visualization mode: parse mixed content
                logConsole('Parsing full AI response (text + visualizations)...', 'info');

                const sections = parseFullAIResponse(rawInput);

                if (sections.length === 0) {
                    logConsole('No content found in input', 'warn');
                    return;
                }

                const vizSections = sections.filter(s => s.type === 'visualization');
                const textSections = sections.filter(s => s.type === 'text');

                logConsole(`Found ${vizSections.length} visualization(s) and ${textSections.length} text section(s)`, 'success');

                if (vizSections.length > 0) {
                    logConsole(`Visualizations: ${vizSections.map(v => v.vizType).join(', ')}`, 'info');
                }

                // Create ONE message bubble for the entire response
                const messageBubble = document.createElement('div');
                messageBubble.className = 'message-bubble ai-message';

                const messageHeader = document.createElement('div');
                messageHeader.className = 'message-header';
                messageHeader.innerHTML = '<i class="fas fa-robot"></i> AI Response';

                const messageContent = document.createElement('div');
                messageContent.className = 'message-content';

                messageBubble.appendChild(messageHeader);
                messageBubble.appendChild(messageContent);
                outputArea.appendChild(messageBubble);

                // Render each section in order WITHIN the same bubble
                let vizCounter = 0;
                for (let i = 0; i < sections.length; i++) {
                    const section = sections[i];

                    if (section.type === 'text') {
                        // Render text section inline
                        const textDiv = document.createElement('div');
                        textDiv.style.marginBottom = '15px';
                        textDiv.style.lineHeight = '1.6';

                        // Enhanced markdown rendering
                        let htmlContent = section.content
                            // Headers (must be on their own line)
                            .replace(/^### (.+)$/gm, '<h3 style="margin: 15px 0 10px 0; color: var(--text-primary); font-size: 18px;">$1</h3>')
                            .replace(/^## (.+)$/gm, '<h2 style="margin: 20px 0 10px 0; color: var(--text-primary); font-size: 22px;">$1</h2>')
                            .replace(/^# (.+)$/gm, '<h1 style="margin: 20px 0 10px 0; color: var(--text-primary); font-size: 26px;">$1</h1>')
                            // Horizontal rules
                            .replace(/^---$/gm, '<hr style="border: none; border-top: 1px solid var(--border-color); margin: 20px 0;">')
                            // Emojis with numbers (like 1️⃣ 2️⃣)
                            .replace(/^([0-9]️⃣)\s+\*\*(.+?)\*\*/gm, '<h2 style="margin: 25px 0 15px 0; color: var(--accent-primary); font-size: 24px;">$1 $2</h2>')
                            // Bold text
                            .replace(/\*\*(.+?)\*\*/g, '<strong style="color: var(--accent-primary);">$1</strong>')
                            // Italic text
                            .replace(/\*(.+?)\*/g, '<em>$1</em>')
                            // Inline code
                            .replace(/`(.+?)`/g, '<code style="background: var(--bg-tertiary); padding: 2px 6px; border-radius: 3px; font-family: monospace; font-size: 13px;">$1</code>')
                            // Tables (basic support)
                            .replace(/\|(.+)\|/g, '<div style="font-family: monospace; font-size: 13px; padding: 5px 0;">$1</div>')
                            // Paragraphs
                            .split('\n\n')
                            .map(para => {
                                para = para.trim();
                                if (!para) return '';
                                // Skip if already wrapped in HTML tag
                                if (para.startsWith('<h') || para.startsWith('<hr') || para.startsWith('<div')) {
                                    return para;
                                }
                                return `<p style="margin: 10px 0; color: var(--text-primary);">${para.replace(/\n/g, '<br>')}</p>`;
                            })
                            .join('');

                        textDiv.innerHTML = htmlContent;
                        messageContent.appendChild(textDiv);
                    } else if (section.type === 'visualization') {
                        // Render visualization inline
                        vizCounter++;
                        logConsole(`Rendering ${section.vizType} (${vizCounter}/${vizSections.length})...`, 'info');

                        const vizContainer = document.createElement('div');
                        vizContainer.className = 'viz-container';
                        vizContainer.style.marginBottom = '20px';

                        const vizContentArea = document.createElement('div');
                        vizContentArea.className = 'viz-content-area';

                        vizContainer.appendChild(vizContentArea);
                        messageContent.appendChild(vizContainer);

                        // Render using visualization engine
                        await renderVisualizationInline(section.vizType, section.content, vizContentArea);

                        // Small delay between visualizations to let DOM update
                        await new Promise(resolve => setTimeout(resolve, 100));
                    }
                }

                logConsole(`✅ Rendered ${vizSections.length} visualization(s) and ${textSections.length} text section(s)!`, 'success');
            } else {
                // Single visualization mode
                const vizType = document.getElementById('vizType').value;
                logConsole(`Rendering ${vizType} visualization...`, 'info');
                await renderSingleVisualization(vizType, rawInput, outputArea, 0);
                logConsole(`✅ ${vizType} rendered successfully!`, 'success');
            }
        }

        // Render visualization inline (within existing message bubble)
        async function renderVisualizationInline(vizType, rawInput, vizContentArea) {
            try {
                // Create visualization item object (mimics AI response structure)
                const visualizationItem = {
                    type: vizType.toLowerCase(),
                    content: rawInput,
                    id: `test_${Date.now()}`
                };

                // Call the visualization engine
                const chartId = `chart_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`;

                // Initialize visualization engine if not already done
                if (typeof window.VisualizationEngine === 'undefined') {
                    throw new Error('VisualizationEngine class not loaded from visualisation_v3.js');
                }

                if (!window.visualizationEngineInstance) {
                    logConsole('Initializing visualization engine instance...', 'info');
                    window.visualizationEngineInstance = new VisualizationEngine({
                        theme: ThemeDetector.isDark() ? 'dark' : 'light'
                    });
                }

                // vizContentArea already has the viz-content-area class from parent
                // We need to wrap it in a viz-container div for renderVisualizationDirectly
                const vizWrapper = vizContentArea.parentElement;

                if (!vizWrapper || !vizWrapper.classList.contains('viz-container')) {
                    throw new Error('vizContentArea must be inside a viz-container');
                }

                // Use renderVisualizationDirectly (supports all visualization types)
                await window.visualizationEngineInstance.renderVisualizationDirectly(
                    visualizationItem,
                    vizWrapper,
                    chartId
                );
            } catch (error) {
                logConsole(`Error rendering ${vizType}: ${error.message}`, 'error');
                vizContentArea.innerHTML = `
                    <div style="padding: 20px; text-align: center; color: var(--error);">
                        <h4>⚠️ Rendering Error</h4>
                        <p style="margin-top: 10px; font-size: 14px;">${error.message}</p>
                        <pre style="margin-top: 15px; text-align: left; font-size: 12px; background: var(--bg-tertiary); padding: 10px; border-radius: 4px; overflow-x: auto;">${error.stack || 'No stack trace available'}</pre>
                    </div>
                `;

            messageBubble.appendChild(messageHeader);
