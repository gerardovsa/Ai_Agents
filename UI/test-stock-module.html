<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Module Loading Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .container {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h1 {
            color: #4ec9b0;
            margin-top: 0;
        }

        h2 {
            color: #9cdcfe;
            font-size: 16px;
            margin-top: 20px;
        }

        .log {
            background: #1e1e1e;
            border: 1px solid #3e3e42;
            border-radius: 4px;
            padding: 15px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
        }

        .log-item {
            margin: 5px 0;
            padding: 3px 0;
            border-bottom: 1px solid #3e3e42;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .success {
            color: #4ec9b0;
        }

        .error {
            color: #f48771;
        }

        .warning {
            color: #dcdcaa;
        }

        .info {
            color: #9cdcfe;
        }

        button {
            background: #0e639c;
            color: #d4d4d4;
            border: 1px solid #007acc;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            margin: 5px 0;
            font-size: 12px;
        }

        button:hover {
            background: #1177bb;
        }

        .status-box {
            background: #1e1e1e;
            border-left: 3px solid #4ec9b0;
            padding: 10px;
            margin: 10px 0;
            border-radius: 2px;
        }

        .status-box.error {
            border-left-color: #f48771;
        }

        .status-box.warning {
            border-left-color: #dcdcaa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📦 Stock Module Loading Test</h1>
        <p>This page tests if the stockModule global reference is working correctly.</p>
    </div>

    <div class="container">
        <h2>Test 1: Module Registration</h2>
        <button onclick="testModuleRegistry()">Check Module Registry</button>
        <div class="log" id="test1-log"></div>
    </div>

    <div class="container">
        <h2>Test 2: Global Reference</h2>
        <button onclick="testGlobalReference()">Check Global stockModule</button>
        <div class="log" id="test2-log"></div>
    </div>

    <div class="container">
        <h2>Test 3: Method Access</h2>
        <button onclick="testMethodAccess()">Check Available Methods</button>
        <div class="log" id="test3-log"></div>
    </div>

    <div class="container">
        <h2>Test 4: Simulated Click</h2>
        <button onclick="testMethodCall()">Try Calling loadUsageAnalytics()</button>
        <div class="log" id="test4-log"></div>
    </div>

    <div class="container">
        <h2>Console Output Capture</h2>
        <div class="log" id="console-log"></div>
    </div>

    <script>
        // Capture console logs
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;
        const consoleLogs = [];

        function addConsoleLog(msg, type = 'info') {
            consoleLogs.push({ msg, type, time: new Date().toLocaleTimeString() });
            updateConsoleLog();
        }

        console.log = function (...args) {
            originalLog.apply(console, args);
            addConsoleLog(args.join(' '), 'info');
        };

        console.warn = function (...args) {
            originalWarn.apply(console, args);
            addConsoleLog(args.join(' '), 'warning');
        };

        console.error = function (...args) {
            originalError.apply(console, args);
            addConsoleLog(args.join(' '), 'error');
        };

        function updateConsoleLog() {
            const logDiv = document.getElementById('console-log');
            logDiv.innerHTML = consoleLogs.map(log =>
                `<div class="log-item ${log.type}">[${log.time}] ${log.msg}</div>`
            ).join('');
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Test functions
        function testModuleRegistry() {
            const logDiv = document.getElementById('test1-log');
            let html = '';

            html += `<div class="log-item info">🔍 Checking window.ModuleRegistry...</div>`;

            if (window.ModuleRegistry) {
                html += `<div class="log-item success">✅ window.ModuleRegistry exists</div>`;

                const stockEntry = window.ModuleRegistry['stock-management'];
                if (stockEntry) {
                    html += `<div class="log-item success">✅ stock-management entry found</div>`;

                    // Check if it's a class or instance
                    if (typeof stockEntry === 'function') {
                        html += `<div class="log-item warning">⚠️  Entry is still a CLASS (not instantiated yet)</div>`;
                    } else if (typeof stockEntry === 'object') {
                        html += `<div class="log-item success">✅ Entry is an OBJECT (likely instantiated)</div>`;

                        // Check for methods
                        const methods = ['initialize', 'loadUsageAnalytics', 'loadReorderDashboard'];
                        methods.forEach(method => {
                            if (typeof stockEntry[method] === 'function') {
                                html += `<div class="log-item success">   ✅ Method: ${method}()</div>`;
                            }
                        });
                    }
                } else {
                    html += `<div class="log-item error">❌ stock-management entry NOT found in ModuleRegistry</div>`;
                    html += `<div class="log-item info">   Available entries: ${Object.keys(window.ModuleRegistry).join(', ') || 'none'}</div>`;
                }
            } else {
                html += `<div class="log-item error">❌ window.ModuleRegistry DOES NOT EXIST</div>`;
            }

            logDiv.innerHTML = html;
        }

        function testGlobalReference() {
            const logDiv = document.getElementById('test2-log');
            let html = '';

            html += `<div class="log-item info">🔍 Checking window.stockModule...</div>`;

            if (typeof window.stockModule !== 'undefined') {
                html += `<div class="log-item success">✅ window.stockModule exists</div>`;

                if (window.stockModule === null) {
                    html += `<div class="log-item error">   ❌ But it's NULL</div>`;
                } else if (typeof window.stockModule === 'object') {
                    html += `<div class="log-item success">   ✅ It's an object</div>`;
                    html += `<div class="log-item info">   Type: ${window.stockModule.constructor.name}</div>`;
                    html += `<div class="log-item info">   Methods: ${Object.getOwnPropertyNames(Object.getPrototypeOf(window.stockModule)).slice(0, 5).join(', ')}...</div>`;
                } else if (typeof window.stockModule === 'function') {
                    html += `<div class="log-item warning">   ⚠️  It's a function (likely the class, not instance)</div>`;
                }
            } else {
                html += `<div class="log-item error">❌ window.stockModule DOES NOT EXIST</div>`;

                // Check ModuleManager
                if (window.ModuleManager) {
                    html += `<div class="log-item info">   ModuleManager exists</div>`;
                    if (window.ModuleManager.modules) {
                        const stockEntry = window.ModuleManager.modules.get?.('stock-management');
                        if (stockEntry) {
                            html += `<div class="log-item warning">   ⚠️  But ModuleManager has stock-management entry</div>`;
                            if (stockEntry.instance) {
                                html += `<div class="log-item success">   ✅ Entry has an instance!</div>`;
                            }
                        }
                    }
                }
            }

            logDiv.innerHTML = html;
        }

        function testMethodAccess() {
            const logDiv = document.getElementById('test3-log');
            let html = '';

            html += `<div class="log-item info">🔍 Checking available methods on stockModule...</div>`;

            if (typeof window.stockModule === 'undefined') {
                html += `<div class="log-item error">❌ window.stockModule is not defined</div>`;
            } else if (window.stockModule === null) {
                html += `<div class="log-item error">❌ window.stockModule is null</div>`;
            } else {
                const methods = [
                    'loadUsageAnalytics',
                    'loadReorderDashboard',
                    'refreshUsageAnalyticsTab',
                    'refreshReorderDashboardTab',
                    'refreshInvoiceTab',
                    'refreshProfitAnalysisTab'
                ];

                methods.forEach(method => {
                    if (typeof window.stockModule[method] === 'function') {
                        html += `<div class="log-item success">✅ ${method}()</div>`;
                    } else {
                        html += `<div class="log-item error">❌ ${method}() - NOT FOUND</div>`;
                    }
                });
            }

            logDiv.innerHTML = html;
        }

        function testMethodCall() {
            const logDiv = document.getElementById('test4-log');
            let html = '';

            html += `<div class="log-item info">🔍 Attempting to call stockModule.loadUsageAnalytics()...</div>`;

            try {
                if (typeof window.stockModule === 'undefined') {
                    html += `<div class="log-item error">❌ window.stockModule is undefined</div>`;
                } else if (typeof window.stockModule.loadUsageAnalytics !== 'function') {
                    html += `<div class="log-item error">❌ loadUsageAnalytics is not a function</div>`;
                } else {
                    html += `<div class="log-item info">   Calling method...</div>`;
                    window.stockModule.loadUsageAnalytics();
                    html += `<div class="log-item success">✅ Method call completed (check network tab and console)</div>`;
                }
            } catch (error) {
                html += `<div class="log-item error">❌ ERROR: ${error.message}</div>`;
                html += `<div class="log-item error">   Stack: ${error.stack.split('\n')[1]}</div>`;
            }

            logDiv.innerHTML = html;
        }

        // Run tests on load
        window.addEventListener('load', () => {
            console.log('Page loaded - Stock Module test ready');
            console.log('Click buttons to run tests');

            // Auto-run test 1
            setTimeout(() => testModuleRegistry(), 500);
        });
    </script>
</body>

</html>
