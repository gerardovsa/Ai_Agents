<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Docs Libraries Test</title>

    <!-- Handsontable -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.css">
    <script src="https://cdn.jsdelivr.net/npm/handsontable/dist/handsontable.full.min.js"></script>

    <!-- HyperFormula -->
    <script src="https://cdn.jsdelivr.net/npm/hyperformula/dist/hyperformula.full.min.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- SheetJS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <!-- Tiptap -->
    <script src="https://cdn.jsdelivr.net/npm/@tiptap/core@2.1.13/dist/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tiptap/starter-kit@2.1.13/dist/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tiptap/extension-placeholder@2.1.13/dist/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tiptap/extension-link@2.1.13/dist/index.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tiptap/extension-mention@2.1.13/dist/index.umd.min.js"></script>

    <!-- jsPDF -->
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .test-container {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #333;
            border-bottom: 3px solid #4CAF50;
            padding-bottom: 12px;
        }

        h2 {
            color: #555;
            margin-top: 0;
        }

        .status {
            padding: 8px 16px;
            border-radius: 6px;
            display: inline-block;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }

        .test-result {
            margin: 8px 0;
            padding: 8px;
            border-left: 4px solid #ddd;
            background: #f9f9f9;
        }

        .test-result.pass {
            border-left-color: #4CAF50;
        }

        .test-result.fail {
            border-left-color: #f44336;
        }

        #handsontable-demo {
            height: 300px;
            margin-top: 12px;
        }

        #tiptap-demo {
            min-height: 200px;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-top: 12px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .toolbar button {
            padding: 8px 16px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .toolbar button:hover {
            background: #0056b3;
        }

        code {
            background: #f4f4f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>

<body>
    <h1>📚 Internal Docs Libraries Test</h1>
    <p>Testing all CDN libraries for the internal documentation system.</p>

    <!-- Test Results Summary -->
    <div class="test-container" id="summary-container">
        <h2>Test Summary</h2>
        <div id="test-results"></div>
    </div>

    <!-- Handsontable Test -->
    <div class="test-container">
        <h2>1. Handsontable Spreadsheet Test</h2>
        <div id="handsontable-status"></div>
        <div id="handsontable-demo"></div>
        <div class="toolbar" style="margin-top: 12px;">
            <button onclick="testFormula()">Test Formula (=SUM)</button>
            <button onclick="exportToExcel()">Export to Excel</button>
        </div>
    </div>

    <!-- Tiptap Test -->
    <div class="test-container">
        <h2>2. Tiptap Rich Text Editor Test</h2>
        <div id="tiptap-status"></div>
        <div class="toolbar">
            <button onclick="makeBold()">Bold</button>
            <button onclick="makeItalic()">Italic</button>
            <button onclick="makeHeading()">Heading</button>
            <button onclick="exportToPDF()">Export to PDF</button>
        </div>
        <div id="tiptap-demo"></div>
    </div>

    <!-- Chart.js Test -->
    <div class="test-container">
        <h2>3. Chart.js Visualization Test</h2>
        <div id="chartjs-status"></div>
        <canvas id="chart-demo" width="400" height="200"></canvas>
    </div>

    <script>
        const testResults = [];
        let hotInstance = null;
        let tiptapEditor = null;

        // Test 1: Handsontable
        function testHandsontable() {
            const container = document.getElementById('handsontable-demo');
            const status = document.getElementById('handsontable-status');

            if (typeof Handsontable === 'undefined') {
                status.innerHTML = '<div class="status error">❌ FAILED - Handsontable not loaded</div>';
                testResults.push({ name: 'Handsontable', pass: false, error: 'Library not loaded' });
                return;
            }

            try {
                // Test HyperFormula
                let hyperformulaInstance = null;
                if (typeof HyperFormula !== 'undefined') {
                    hyperformulaInstance = HyperFormula.buildEmpty({ licenseKey: 'gpl-v3' });
                }

                hotInstance = new Handsontable(container, {
                    data: [
                        ['Product', 'Q1', 'Q2', 'Q3', 'Total'],
                        ['Widget A', 100, 150, 200, '=SUM(B2:D2)'],
                        ['Widget B', 75, 125, 175, '=SUM(B3:D3)'],
                        ['Widget C', 50, 100, 150, '=SUM(B4:D4)'],
                        ['Total', '=SUM(B2:B4)', '=SUM(C2:C4)', '=SUM(D2:D4)', '=SUM(E2:E4)']
                    ],
                    colHeaders: true,
                    rowHeaders: true,
                    width: '100%',
                    height: 300,
                    licenseKey: 'non-commercial-and-evaluation',
                    formulas: hyperformulaInstance ? { engine: hyperformulaInstance } : false,
                    contextMenu: true,
                    manualColumnResize: true,
                    manualRowResize: true
                });

                const formulaSupport = hyperformulaInstance ? 'with formulas' : 'without formulas';
                status.innerHTML = `<div class="status success">✅ SUCCESS - Handsontable loaded ${formulaSupport}</div>`;
                testResults.push({
                    name: 'Handsontable',
                    pass: true,
                    details: `Spreadsheet initialized ${formulaSupport}, context menu enabled`
                });
            } catch (error) {
                status.innerHTML = `<div class="status error">❌ FAILED - ${error.message}</div>`;
                testResults.push({ name: 'Handsontable', pass: false, error: error.message });
            }
        }

        // Test 2: Tiptap
        function testTiptap() {
            const container = document.getElementById('tiptap-demo');
            const status = document.getElementById('tiptap-status');

            if (typeof window.tiptapCore === 'undefined') {
                status.innerHTML = '<div class="status error">❌ FAILED - Tiptap not loaded</div>';
                testResults.push({ name: 'Tiptap', pass: false, error: 'Library not loaded' });
                return;
            }

            try {
                const { Editor } = window.tiptapCore;
                const StarterKit = window.tiptapStarterKit?.StarterKit || window.tiptapStarterKit;

                tiptapEditor = new Editor({
                    element: container,
                    extensions: [StarterKit],
                    content: '<p>This is a <strong>rich text editor</strong> powered by Tiptap. Try editing this text!</p>'
                });

                status.innerHTML = '<div class="status success">✅ SUCCESS - Tiptap editor initialized</div>';
                testResults.push({
                    name: 'Tiptap',
                    pass: true,
                    details: 'Rich text editor with StarterKit extensions'
                });
            } catch (error) {
                status.innerHTML = `<div class="status error">❌ FAILED - ${error.message}</div>`;
                testResults.push({ name: 'Tiptap', pass: false, error: error.message });
            }
        }

        // Test 3: Chart.js
        function testChartJS() {
            const canvas = document.getElementById('chart-demo');
            const status = document.getElementById('chartjs-status');

            if (typeof Chart === 'undefined') {
                status.innerHTML = '<div class="status error">❌ FAILED - Chart.js not loaded</div>';
                testResults.push({ name: 'Chart.js', pass: false, error: 'Library not loaded' });
                return;
            }

            try {
                new Chart(canvas, {
                    type: 'bar',
                    data: {
                        labels: ['Q1', 'Q2', 'Q3', 'Q4'],
                        datasets: [{
                            label: 'Sales 2025',
                            data: [225, 375, 525, 675],
                            backgroundColor: ['#4CAF50', '#2196F3', '#FFC107', '#F44336']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true
                    }
                });

                status.innerHTML = '<div class="status success">✅ SUCCESS - Chart.js working</div>';
                testResults.push({
                    name: 'Chart.js',
                    pass: true,
                    details: 'Bar chart rendered successfully'
                });
            } catch (error) {
                status.innerHTML = `<div class="status error">❌ FAILED - ${error.message}</div>`;
                testResults.push({ name: 'Chart.js', pass: false, error: error.message });
            }
        }

        // Test 4: SheetJS
        function testSheetJS() {
            if (typeof XLSX === 'undefined') {
                testResults.push({ name: 'SheetJS', pass: false, error: 'Library not loaded' });
                return;
            }
            testResults.push({ name: 'SheetJS', pass: true, details: 'Excel export library available' });
        }

        // Test 5: jsPDF
        function testJSPDF() {
            if (typeof window.jspdf === 'undefined') {
                testResults.push({ name: 'jsPDF', pass: false, error: 'Library not loaded' });
                return;
            }
            testResults.push({ name: 'jsPDF', pass: true, details: 'PDF export library available' });
        }

        // Test 6: html2canvas
        function testHtml2Canvas() {
            if (typeof html2canvas === 'undefined') {
                testResults.push({ name: 'html2canvas', pass: false, error: 'Library not loaded' });
                return;
            }
            testResults.push({ name: 'html2canvas', pass: true, details: 'Canvas rendering library available' });
        }

        // Interactive Functions
        function testFormula() {
            if (hotInstance) {
                alert('Formula =SUM(B2:D2) calculates: ' + hotInstance.getDataAtCell(1, 4));
            }
        }

        function exportToExcel() {
            if (typeof XLSX === 'undefined' || !hotInstance) {
                alert('SheetJS not available');
                return;
            }
            const data = hotInstance.getData();
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
            XLSX.writeFile(wb, 'test-export.xlsx');
            alert('Excel file exported!');
        }

        function makeBold() {
            if (tiptapEditor) tiptapEditor.chain().focus().toggleBold().run();
        }

        function makeItalic() {
            if (tiptapEditor) tiptapEditor.chain().focus().toggleItalic().run();
        }

        function makeHeading() {
            if (tiptapEditor) tiptapEditor.chain().focus().toggleHeading({ level: 2 }).run();
        }

        function exportToPDF() {
            if (typeof window.jspdf === 'undefined') {
                alert('jsPDF not available');
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const content = tiptapEditor.getHTML();
            doc.text(content.replace(/<[^>]*>/g, ''), 10, 10);
            doc.save('test-export.pdf');
            alert('PDF exported!');
        }

        // Display Results
        function displayResults() {
            const container = document.getElementById('test-results');
            const passed = testResults.filter(t => t.pass).length;
            const total = testResults.length;

            let html = `<div class="status ${passed === total ? 'success' : 'error'}">
                ${passed}/${total} Tests Passed
            </div>`;

            testResults.forEach(result => {
                html += `
                    <div class="test-result ${result.pass ? 'pass' : 'fail'}">
                        <strong>${result.pass ? '✅' : '❌'} ${result.name}</strong><br>
                        ${result.pass ?
                        `<code>${result.details}</code>` :
                        `<span style="color: #721c24;">Error: ${result.error}</span>`
                    }
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Run all tests
        window.onload = function () {
            testHandsontable();
            testTiptap();
            testChartJS();
            testSheetJS();
            testJSPDF();
            testHtml2Canvas();
            displayResults();
        };
    </script>
</body>

</html>
