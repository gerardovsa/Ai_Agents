<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .test-section {
            background: #2a2a2a;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #0066ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #0052cc;
        }
        #output {
            background: #333;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #333;
            border: 1px solid #555;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .success {
            color: #00ff00;
        }
        .error {
            color: #ff0000;
        }
    </style>
</head>
<body>
    <h1>🔧 Chat Diagnostic Tool</h1>
    
    <div class="test-section">
        <h2>1. Test Backend Connection</h2>
        <button onclick="testHealth()">Test /health</button>
        <div id="output-health"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Test Chat Endpoint</h2>
        <textarea id="chatMessage" rows="3" placeholder="Enter your message...">Hello, can you help me?</textarea>
        <button onclick="testChat()">Send Test Message</button>
        <div id="output-chat"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Test Full Chat Flow</h2>
        <button onclick="testFullFlow()">Run Full Test</button>
        <div id="output-full"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:4000';

        async function testHealth() {
            const output = document.getElementById('output-health');
            output.innerHTML = '⏳ Testing...';
            
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                
                output.innerHTML = `<span class="success">✅ SUCCESS</span>\n` +
                    `Status: ${response.status}\n` +
                    `Response: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                output.innerHTML = `<span class="error">❌ FAILED</span>\n` +
                    `Error: ${error.message}\n` +
                    `\nCheck:\n` +
                    `1. Is Flask running? (should be on port 4000)\n` +
                    `2. Run: netstat -ano | findstr ":4000"\n` +
                    `3. CORS may block file:// protocol - try opening from http://`;
            }
        }

        async function testChat() {
            const output = document.getElementById('output-chat');
            const message = document.getElementById('chatMessage').value;
            
            output.innerHTML = '⏳ Sending message...';
            
            try {
                const response = await fetch(`${API_BASE}/api/agent/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: 'test_' + Date.now()
                    })
                });
                
                const data = await response.json();
                
                output.innerHTML = `<span class="success">✅ SUCCESS</span>\n` +
                    `Status: ${response.status}\n` +
                    `Mode: ${data.mode}\n` +
                    `Response: ${data.response}\n\n` +
                    `Full Data: ${JSON.stringify(data, null, 2)}`;
            } catch (error) {
                output.innerHTML = `<span class="error">❌ FAILED</span>\n` +
                    `Error: ${error.message}\n` +
                    `\nPossible causes:\n` +
                    `1. Flask not running on port 4000\n` +
                    `2. CORS blocking request from file:// protocol\n` +
                    `3. Endpoint not responding\n\n` +
                    `Try running from a local server instead of file://`;
            }
        }

        async function testFullFlow() {
            const output = document.getElementById('output-full');
            output.innerHTML = '⏳ Running full diagnostic...\n\n';
            
            let results = '';
            
            // Test 1: Health
            results += '📍 Test 1: Health Check\n';
            try {
                const health = await fetch(`${API_BASE}/health`);
                const healthData = await health.json();
                results += `✅ Health: ${healthData.status}\n\n`;
            } catch (e) {
                results += `❌ Health failed: ${e.message}\n\n`;
                output.innerHTML = results;
                return;
            }
            
            // Test 2: Tools
            results += '📍 Test 2: Get Tools\n';
            try {
                const tools = await fetch(`${API_BASE}/api/agent/tools`);
                const toolsData = await tools.json();
                results += `✅ Tools: ${toolsData.total_tools} available\n\n`;
            } catch (e) {
                results += `❌ Tools failed: ${e.message}\n\n`;
            }
            
            // Test 3: Chat
            results += '📍 Test 3: Send Chat Message\n';
            try {
                const chat = await fetch(`${API_BASE}/api/agent/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: 'Test diagnostic message',
                        session_id: 'diagnostic_' + Date.now()
                    })
                });
                const chatData = await chat.json();
                results += `✅ Chat: ${chatData.success ? 'Working' : 'Failed'}\n`;
                results += `   Mode: ${chatData.mode}\n`;
                results += `   Response: ${chatData.response.substring(0, 100)}...\n\n`;
            } catch (e) {
                results += `❌ Chat failed: ${e.message}\n\n`;
            }
            
            results += '\n🎉 All tests complete!\n';
            results += '\nIf all tests passed but the main UI still doesn\'t work:\n';
            results += '1. Check browser console for JavaScript errors (F12)\n';
            results += '2. Verify event listeners are attached\n';
            results += '3. Check if AppState.isConnected is true\n';
            
            output.innerHTML = results;
        }

        // Auto-run health check on load
        window.addEventListener('load', () => {
            console.log('🔧 Diagnostic tool loaded');
            console.log('Backend URL:', API_BASE);
        });
    </script>
</body>
</html>
