# ==============================================================================
# DJANGO WEB APPLICATION - RENDER.COM DEPLOYMENT CONFIGURATION
# ==============================================================================
#
# This configuration file deploys a Django web application to Render.com.
# Django is a high-level Python web framework that encourages rapid development.
#
# WHAT THIS CONFIGURES:
# - Web service running Django with Gunicorn
# - PostgreSQL database for production
# - Static files serving with WhiteNoise
# - Database migrations on each deployment
# - Health check endpoint
#
# PREREQUISITES:
# 1. Django project with settings.py configured for production
# 2. requirements.txt with gunicorn, psycopg2-binary, whitenoise, dj-database-url
# 3. Health check endpoint at /health/
# 4. ALLOWED_HOSTS configured to read from environment
# 5. Static files configured with WhiteNoise
#
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # DJANGO WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: my-django-app
    runtime: python
    env: python
    region: oregon  # Options: oregon, frankfurt, singapore, ohio, virginia
    
    # Build Configuration
    # Django requires collectstatic to gather all static files into STATIC_ROOT
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
      python manage.py migrate --no-input
    
    # Start Command
    # Gunicorn serves Django application
    # Format: gunicorn [project_name].wsgi:application
    # Replace 'myproject' with your Django project folder name
    startCommand: gunicorn myproject.wsgi:application --bind 0.0.0.0:$PORT --workers 4
    
    # Plan Configuration
    # Starter: Free tier, sleeps after inactivity
    # Standard: $7/month, always on, better performance
    # Pro: $25/month, 2GB RAM, 2 CPUs
    plan: starter
    
    # Auto-Deploy
    # When true, pushes to branch trigger automatic deployments
    autoDeploy: true
    
    # Health Check
    # Render pings this endpoint to verify service is running
    # Return HTTP 200 for healthy status
    healthCheckPath: /health/
    
    # Environment Variables
    envVars:
      # Python Version
      - key: PYTHON_VERSION
        value: "3.11"
      
      # Django Settings Module
      # Points to your settings file (usually myproject.settings)
      - key: DJANGO_SETTINGS_MODULE
        value: myproject.settings
      
      # Secret Key
      # CRITICAL: Generate with 'python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"'
      # NEVER commit this to git!
      - key: SECRET_KEY
        generateValue: true  # Render generates random value
      
      # Debug Mode
      # ALWAYS False in production
      - key: DEBUG
        value: "False"
      
      # Allowed Hosts
      # Comma-separated list of domains Django will accept requests from
      # Include your custom domain and Render domain
      - key: ALLOWED_HOSTS
        value: ".onrender.com,yourdomain.com"
      
      # Database URL
      # Automatically provided when you add a PostgreSQL database
      # Format: postgresql://user:password@host:5432/dbname
      - key: DATABASE_URL
        fromDatabase:
          name: my-django-db
          property: connectionString
      
      # Redis URL (optional)
      # For caching and session storage
      # - key: REDIS_URL
      #   fromDatabase:
      #     name: my-redis-db
      #     property: connectionString
      
      # CSRF Trusted Origins
      # Required for forms to work with custom domain
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://my-django-app.onrender.com,https://yourdomain.com"
      
      # Email Configuration (optional)
      # For sending emails via SMTP
      # - key: EMAIL_HOST
      #   value: smtp.gmail.com
      # - key: EMAIL_PORT
      #   value: "587"
      # - key: EMAIL_USE_TLS
      #   value: "True"
      # - key: EMAIL_HOST_USER
      #   sync: false  # Marked as secret
      # - key: EMAIL_HOST_PASSWORD
      #   sync: false  # Marked as secret
      
      # AWS S3 Configuration (optional)
      # For serving media files from S3
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: AWS_STORAGE_BUCKET_NAME
      #   value: my-bucket
      # - key: AWS_S3_REGION_NAME
      #   value: us-east-1

# ==============================================================================
# DATABASES (OPTIONAL)
# ==============================================================================
# Uncomment to create a PostgreSQL database automatically
# databases:
#   - name: my-django-db
#     databaseName: django_db
#     user: django_user
#     plan: starter  # Free tier: 1GB storage, 97 connection limit
#     region: oregon  # Should match web service region

