# ==============================================================================
# POST-DEPLOYMENT STEPS
# ==============================================================================
# After first deployment:
#
# 1. CREATE SUPERUSER:
#    # SSH into your Render service (available on Pro plan)
#    # OR use a management command:
#    python manage.py createsuperuser --noinput --username admin --email admin@example.com
#
# 2. VERIFY STATIC FILES:
#    curl https://your-app.onrender.com/static/admin/css/base.css
#    # Should return CSS content, not 404
#
# 3. TEST ADMIN PANEL:
#    https://your-app.onrender.com/admin/
#    # Should show login page with proper styling
#
# 4. CHECK DATABASE MIGRATIONS:
#    # View deploy logs to ensure migrations ran successfully
#    python render_universal_cli.py logs tail <service-id>
#
# 5. CONFIGURE CUSTOM DOMAIN (optional):
#    # In Render dashboard: Settings > Custom Domains
#    # Add CNAME record pointing to your-app.onrender.com
#    # SSL certificate auto-generated
#
# ==============================================================================
# COMMON ISSUES & SOLUTIONS
# ==============================================================================
#
# ISSUE: DisallowedHost at /
# SOLUTION: Add your domain to ALLOWED_HOSTS environment variable
#
# ISSUE: Static files not loading (404 errors)
# SOLUTION: Ensure WhiteNoise is installed and middleware is configured
#           Run collectstatic in buildCommand
#
# ISSUE: CSRF verification failed
# SOLUTION: Add domains to CSRF_TRUSTED_ORIGINS environment variable
#           Must include https:// prefix
#
# ISSUE: Database connection refused
# SOLUTION: Ensure DATABASE_URL is set correctly
#           Check database is created and in same region
#           Verify psycopg2-binary is in requirements.txt
#
# ISSUE: 502 Bad Gateway on startup
# SOLUTION: Check Gunicorn command has correct project name
#           Format: gunicorn [project_name].wsgi:application
#           Check logs for Python import errors
#
# ==============================================================================
# SCALING & PERFORMANCE
# ==============================================================================
#
# HORIZONTAL SCALING:
# - Upgrade plan: Standard ($7/mo) or Pro ($25/mo)
# - Increase Gunicorn workers: --workers 4 (formula: 2 x CPU + 1)
# - Add threads: --workers 2 --threads 4
#
# VERTICAL SCALING:
# - Pro plan: 2GB RAM, 2 CPUs
# - Pro Plus: 4GB RAM, 4 CPUs
# - Pro Max: 8GB RAM, 8 CPUs
#
# DATABASE OPTIMIZATION:
# - Enable connection pooling (conn_max_age=600)
# - Add database indexes for frequently queried fields
# - Use select_related() and prefetch_related() for queries
# - Upgrade database plan for more storage/connections
#
# CACHING:
# - Add Redis for caching: redis.onrender.com
# - Configure Django cache backend in settings.py
# - Cache expensive queries and rendered templates
# - Use cache middleware for entire views
#
# MEDIA FILES:
# - Use AWS S3 for user-uploaded files
# - Configure django-storages with S3 backend
# - Never store media files on Render (ephemeral storage)
#
# MONITORING:
# - Use python render_universal_cli.py metrics all <service-id>
# - Set up Sentry for error tracking
# - Use Django Debug Toolbar locally only
# - Monitor database query performance with django-silk
#
