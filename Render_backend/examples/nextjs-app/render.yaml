# ==============================================================================
# NEXT.JS APPLICATION - RENDER.COM DEPLOYMENT CONFIGURATION
# ==============================================================================
#
# This configuration file deploys a Next.js application to Render.com.
# Next.js is a React framework for production with server-side rendering.
#
# WHAT THIS CONFIGURES:
# - Web service running Next.js production build
# - Automatic build optimization
# - Image optimization support
# - Server-side rendering (SSR) and Static Site Generation (SSG)
#
# PREREQUISITES:
# 1. Next.js project with next.config.js
# 2. package.json with build and start scripts
# 3. Node version specified in package.json engines
# 4. Environment variables for API keys, database URLs, etc.
#
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # NEXT.JS WEB SERVICE
  # ----------------------------------------------------------------------------
  - type: web
    name: my-nextjs-app
    runtime: node
    env: node
    region: oregon  # Options: oregon, frankfurt, singapore, ohio, virginia
    
    # Build Configuration
    # Next.js requires 'npm run build' to create optimized production build
    # This creates a .next folder with compiled pages
    buildCommand: npm install && npm run build
    
    # Start Command
    # Starts Next.js production server
    # Default port is 3000, but Render overrides with $PORT
    startCommand: npm start
    
    # Plan Configuration
    # Starter: Free tier, sleeps after inactivity
    # Standard: $7/month, always on, better for SSR
    # Pro: $25/month, recommended for production SSR apps
    plan: standard
    
    # Auto-Deploy
    # Automatically deploy when pushing to connected branch
    autoDeploy: true
    
    # Health Check
    # Next.js doesn't have default health endpoint
    # Create custom endpoint in pages/api/health.js
    healthCheckPath: /api/health
    
    # Environment Variables
    envVars:
      # Node Version
      # Should match version in package.json
      - key: NODE_VERSION
        value: "20.11.0"
      
      # Node Environment
      # CRITICAL for production optimizations
      - key: NODE_ENV
        value: production
      
      # Next.js Configuration
      # Base URL for your application
      - key: NEXT_PUBLIC_BASE_URL
        value: https://my-nextjs-app.onrender.com
      
      # API URL
      # If you have separate backend API
      - key: NEXT_PUBLIC_API_URL
        value: https://my-api.onrender.com
      
      # Database URL (if using database)
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: my-postgres-db
      #     property: connectionString
      
      # Authentication Secrets
      # For NextAuth.js or similar
      # - key: NEXTAUTH_SECRET
      #   generateValue: true
      # - key: NEXTAUTH_URL
      #   value: https://my-nextjs-app.onrender.com
      
      # Third-Party API Keys
      # IMPORTANT: Use NEXT_PUBLIC_ prefix ONLY for client-side variables
      # Server-side only variables don't need prefix
      # 
      # Client-side (available in browser):
      # - key: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
      #   value: G-XXXXXXXXXX
      # - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
      #   value: pk_test_xxxxx
      #
      # Server-side only (NOT exposed to browser):
      # - key: STRIPE_SECRET_KEY
      #   sync: false
      # - key: DATABASE_URL
      #   sync: false
      # - key: JWT_SECRET
      #   generateValue: true
      
      # Vercel Analytics (if migrating from Vercel)
      # - key: NEXT_PUBLIC_VERCEL_ENV
      #   value: production
      
      # Image Optimization
      # Next.js Image component domains
      # Configure in next.config.js, but can use env vars
      # - key: NEXT_PUBLIC_IMAGE_DOMAINS
      #   value: images.unsplash.com,cdn.example.com

# ==============================================================================
# DATABASES (OPTIONAL)
# ==============================================================================
# Uncomment if your Next.js app uses database
# databases:
#   - name: my-postgres-db
#     databaseName: nextjs_db
#     user: nextjs_user
#     plan: starter
#     region: oregon

